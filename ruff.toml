# Lint settings (`pip install ruff && ruff check .`).
# `target-version` is maintained by `.github/scripts/maintenance.py` and clamped
# to the highest Ruff-supported syntax target at or below `.python-version`
# (configured in `.github/maintenance.json`).
target-version = "py314"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "SIM", "I"]
ignore = [
    "B905",    # zip() without strict= — lengths are equal by construction
    "SIM105",  # contextlib.suppress — explicit try/except reads better for non-developers
    "SIM108",  # ternary operator suggestions
    "UP007", "UP045",
    "UP017",   # datetime.timezone.utc stays readable + works on older Pythons
    "UP041",   # asyncio.TimeoutError is the right class on Python 3.10 too
]

[lint.per-file-ignores]
"tests/*" = ["E731"]
".github/scripts/maintenance_common.py" = ["UP035", "SIM102"]
