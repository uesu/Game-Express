# Oracle Cloud Always Free VM / any VPS / Raspberry Pi / home PC:
#   cp .env.example .env   (fill it)   then:   docker compose -f deploy/docker-compose.yml up -d --build
services:
  game-express:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../state:/app/state          # dedup + message ids persist on the host
    command: ["python", "-m", "gamexpress", "bot"]   # or ["python", "-m", "gamexpress", "loop"]
