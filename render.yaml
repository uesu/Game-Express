# Render Blueprint — New → Blueprint → pick this repo. Free web services sleep after
# ~15 min without traffic: point a free uptime pinger at https://<your-app>.onrender.com/healthz
# every 5 minutes (see docs/HOSTING.md). Render's disk is ephemeral: after a redeploy the
# first run re-seeds silently (never re-posts old items).
services:
  - type: web
    name: game-express
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-bot.txt
    startCommand: python -m gamexpress bot
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_WEBHOOK_SCHEDULE
        sync: false
      - key: DISCORD_WEBHOOK_CODES
        sync: false
      - key: PING_ROLE_ID
        sync: false
