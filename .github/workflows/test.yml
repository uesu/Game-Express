name: Game-Express Test

# Manual test bench — run it from Actions → "Game-Express Test" → Run workflow.
# It NEVER commits and never touches state/state.json, so it is safe on the production
# repos, and it is not blocked by ENABLED_FEATURES=none (works on the dev repo too).
#
#   offline-tests      the CI suite: 50+ offline tests + config validation (no network, no posts)
#   webhooks           ONE small "✅ connected" card per webhook, listing which game/feature
#                      cards that channel will receive (checks every per-game codes secret)
#   sample-cards       your 4 reference schedule cards + one codes card per game, labelled
#                      🧪 TEST, sent to the REAL routes (each game's codes channel gets its own)
#   live-dry-run       a full REAL run: every source fetched, cards built and validated,
#                      shown in the log + job summary — nothing posted, nothing saved
#   live-test-channel  like live-dry-run but POSTS the real current cards (labelled 🧪 TEST)
#                      to ONE test channel: secret DISCORD_WEBHOOK_TEST (skipped if unset)
#   full               offline-tests → webhooks → sample-cards → live-dry-run
# Step-by-step checklist: docs/TESTING.md

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'What to test'
        type: choice
        options: [webhooks, sample-cards, live-dry-run, live-test-channel, offline-tests, full]
        default: webhooks
      kind:
        description: 'Which cards (webhooks / sample-cards / live runs)'
        type: choice
        options: [all, schedule, codes]
        default: all
      game:
        description: 'Which game'
        type: choice
        options: [all, genshin, starrail, zzz, wuwa, hna, ananta]
        default: all
      ping:
        description: 'Include your role ping in test cards (default off: nobody gets notified)'
        type: boolean
        default: false

concurrency:
  group: game-express-test-${{ github.ref }}
  cancel-in-progress: true          # safe: this workflow never writes state

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      DISCORD_WEBHOOK_SCHEDULE: ${{ secrets.DISCORD_WEBHOOK_SCHEDULE }}
      DISCORD_WEBHOOK_CODES: ${{ secrets.DISCORD_WEBHOOK_CODES }}
      DISCORD_WEBHOOK_CODES_GENSHIN: ${{ secrets.DISCORD_WEBHOOK_CODES_GENSHIN }}
      DISCORD_WEBHOOK_CODES_STARRAIL: ${{ secrets.DISCORD_WEBHOOK_CODES_STARRAIL }}
      DISCORD_WEBHOOK_CODES_HNA: ${{ secrets.DISCORD_WEBHOOK_CODES_HNA }}
      DISCORD_WEBHOOK_CODES_ZZZ: ${{ secrets.DISCORD_WEBHOOK_CODES_ZZZ }}
      DISCORD_WEBHOOK_CODES_WUWA: ${{ secrets.DISCORD_WEBHOOK_CODES_WUWA }}
      DISCORD_WEBHOOK_CODES_ANANTA: ${{ secrets.DISCORD_WEBHOOK_CODES_ANANTA }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NITTER_RSS_TOKEN: ${{ secrets.NITTER_RSS_TOKEN }}
      GE_SECRETS_JSON: ${{ toJSON(secrets) }}
      GE_VARS_JSON: ${{ toJSON(vars) }}
      NO_PING: ${{ !inputs.ping && '1' || '' }}
      PING_FLAG: ${{ inputs.ping && '--ping' || '' }}
      GAME_ARG: ${{ inputs.game != 'all' && inputs.game || '' }}
      KIND: ${{ inputs.kind }}
      TEST: ${{ inputs.test }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check -q
          pip install -r requirements.txt --disable-pip-version-check -q

      - name: 1 · Resolved config (which secret feeds which channel, pings, emojis)
        run: python -m gamexpress validate

      - name: 2 · Offline tests (no network, no secrets)
        if: env.TEST == 'offline-tests' || env.TEST == 'full'
        run: |
          pip install -r requirements-bot.txt pyyaml --disable-pip-version-check -q   # bot + workflow checks too
          python -m compileall -q gamexpress tests
          python tests/test_smoke.py

      - name: 3 · Webhook check (one small card per webhook)
        if: env.TEST == 'webhooks' || env.TEST == 'full'
        run: python -m gamexpress check-webhooks --kind "$KIND" ${GAME_ARG:+--game "$GAME_ARG"}

      - name: 4 · Sample cards (labelled 🧪 TEST) to the real routes
        if: env.TEST == 'sample-cards' || env.TEST == 'full'
        run: python -m gamexpress test-card --kind "$KIND" ${GAME_ARG:+--game "$GAME_ARG"} $PING_FLAG

      - name: 5 · Live dry run (real sources, cards built + validated, nothing posted or saved)
        if: env.TEST == 'live-dry-run' || env.TEST == 'full'
        env:
          DRY_RUN: '1'
          TEST_MODE: '1'
          BOOTSTRAP_POST: '1'
          LOOKBACK_HOURS: '720'
          STATE_PATH: ${{ runner.temp }}/ge-test-state.json
          ONLY: ${{ inputs.kind != 'all' && inputs.kind || '' }}
          GAME: ${{ inputs.game != 'all' && inputs.game || '' }}
          ENABLED_FEATURES: schedule,codes   # also on the dev repo (where the variable says none)
          INSTANCE_ROLE: primary
          PEER_STATE_URL: none               # test runs never import the peer's state
        run: python -m gamexpress run

      - name: 6 · Live cards to the TEST channel (secret DISCORD_WEBHOOK_TEST)
        if: env.TEST == 'live-test-channel'
        env:
          FORCE_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEST }}
          TEST_MODE: '1'
          BOOTSTRAP_POST: '1'
          LOOKBACK_HOURS: '720'
          STATE_PATH: ${{ runner.temp }}/ge-test-state.json
          ONLY: ${{ inputs.kind != 'all' && inputs.kind || '' }}
          GAME: ${{ inputs.game != 'all' && inputs.game || '' }}
          ENABLED_FEATURES: schedule,codes
          INSTANCE_ROLE: primary
          PEER_STATE_URL: none
        run: |
          if [ -z "$FORCE_WEBHOOK" ]; then
            echo "::warning::Add the secret DISCORD_WEBHOOK_TEST (a webhook of a private test channel) to use live-test-channel."
            exit 0
          fi
          python -m gamexpress run
