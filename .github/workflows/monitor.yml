name: Game-Express Monitor

# Schedule announcements + code poster. It POSTS only when an official post matches a
# pattern (special program / broadcast / maintenance notice / new verified code); most
# runs change nothing and commit nothing.
#
# TRIGGER = cron-job.org (external scheduler) calling the workflow_dispatch API every
# 10 minutes. Setup: docs/SCHEDULER.md (cron-job.org job + GitHub classic token).
#
# ────────────────────────────────────────────────────────────────────────────────────────
# THIS WORKFLOW DOES TWO THINGS, AND THE `mode` INPUT PICKS WHICH:
#
#   mode = live   THE REAL MONITOR (default; this is what cron-job.org triggers, because it
#                 sends no inputs at all). Every input below marked LIVE belongs here.
#                   · (nothing)  a normal pass: post what is new, edit what changed, commit
#                   · probe      debug ONE real schedule post, e.g. starrail:4.6 — fetches it
#                                and prints the text, the link and every image it found, plus
#                                the card it would build. Nothing is posted or saved.
#                   · repost     post a version card again as a NEW message, e.g. starrail:4.6
#                   · dry_run    build + log the cards, never post, never commit
#
#   mode = test   THE MANUAL TEST BENCH. It never posts to the real channels and never
#                 commits state, so it is safe on the production repos and is not blocked by
#                 ENABLED_FEATURES=none (it works on the dev repo too).
#                   · webhooks           ONE small "✅ connected" card per webhook, listing
#                                        which game/feature cards that channel will receive
#                   · sample-cards       your 4 reference schedule cards + one codes card per
#                                        game, labelled 🧪 TEST, sent to the REAL routes
#                   · live-dry-run       a full REAL run: every source fetched, cards built and
#                                        validated, shown in the log + job summary
#                   · live-test-channel  like live-dry-run but POSTS the real current cards
#                                        (labelled 🧪 TEST) to ONE test channel: the secret
#                                        DISCORD_WEBHOOK_TEST (skipped if unset)
#                   · offline-tests      the CI suite: offline tests + compile + config check
#                   · full               offline-tests → webhooks → sample-cards → live-dry-run
#
# `only` and `game` apply to BOTH modes: `only` is the "simplify" switch — everything, only
# schedule announcements, or only codes — and `game` narrows it to one game.
# Step-by-step checklist: docs/TESTING.md
# ────────────────────────────────────────────────────────────────────────────────────────

concurrency:
  # One run at a time. A trigger that arrives mid-run QUEUES and later checks out the
  # NEWEST branch head (with the previous run's state/state.json), so nothing is posted
  # twice. cancel-in-progress MUST stay false: a run can sit between "posted to Discord"
  # and "state committed" — cancelling it there would allow a re-post. Test runs never write
  # state, so queueing them is harmless.
  group: game-express-${{ github.ref }}
  cancel-in-progress: false

on:
  # ── GITHUB NATIVE SCHEDULE: DISABLED ──────────────────────────────────────────────
  # cron-job.org is the SINGLE scheduler for this monitor (same setup as News-Express,
  # where two schedulers raced: both runs checked out the same pre-state commit and
  # both posted). GitHub's own schedule can also start late or skip runs under load.
  # To re-enable GitHub's schedule instead, uncomment these two lines AND pause the
  # cron-job.org job (never run both on the same repo):
  #   schedule:
  #     - cron: '*/10 * * * *'
  workflow_dispatch:          # manual runs + cron-job.org (POST .../workflows/monitor.yml/dispatches)
    inputs:
      mode:
        description: '① WHAT THIS RUN DOES — live = the real monitor run · test = the manual test bench (never posts to the real channels, never commits)'
        type: choice
        options: [live, test]
        default: live
      only:
        description: '② BOTH MODES · the simplify switch — everything, only schedule announcements, or only codes'
        type: choice
        options: [all, schedule, codes]
        default: all
      game:
        description: '③ BOTH MODES · optional: one game (genshin, starrail, zzz, wuwa, hna, ananta)'
        required: false
        default: ''
      probe:
        description: '④ LIVE · debug ONE real schedule post, e.g. starrail:4.6 — fetches it and prints the text, the link and every image it found (nothing posted or saved). Replaces the normal run.'
        required: false
        default: ''
      repost:
        description: '⑤ LIVE · post a version card AGAIN as a new message, e.g. starrail:4.6 (only versions the bot has already seen; the run summary lists them)'
        required: false
        default: ''
      dry_run:
        description: '⑥ LIVE · build + log the cards, never post, never commit'
        type: boolean
        default: false
      test:
        description: '⑦ TEST · which test to run'
        type: choice
        options: [webhooks, sample-cards, live-dry-run, live-test-channel, offline-tests, full]
        default: webhooks
      ping:
        description: '⑧ TEST · include your role ping in the test cards (default off: nobody is notified)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    # Only on a development COPY that must never post: set the repository VARIABLE
    # ENABLED_FEATURES=none and every live run is skipped, even if something triggers it by
    # mistake. A TEST run (mode = test) is still allowed there — it never posts or commits.
    # Never set ENABLED_FEATURES=none on the repo that posts.
    if: vars.ENABLED_FEATURES != 'none' || inputs.mode == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      # ── Discord webhooks (repository SECRETS) ── routing, most specific first:
      #    DISCORD_WEBHOOK_<FEATURE>_<GAME>  >  DISCORD_WEBHOOK_<FEATURE>  >  DISCORD_WEBHOOK_URL
      DISCORD_WEBHOOK_SCHEDULE: ${{ secrets.DISCORD_WEBHOOK_SCHEDULE }}
      DISCORD_WEBHOOK_CODES: ${{ secrets.DISCORD_WEBHOOK_CODES }}                   # optional fallback for codes
      DISCORD_WEBHOOK_CODES_GENSHIN: ${{ secrets.DISCORD_WEBHOOK_CODES_GENSHIN }}   # Genshin Impact codes channel
      DISCORD_WEBHOOK_CODES_STARRAIL: ${{ secrets.DISCORD_WEBHOOK_CODES_STARRAIL }} # Honkai: Star Rail codes channel
      DISCORD_WEBHOOK_CODES_HNA: ${{ secrets.DISCORD_WEBHOOK_CODES_HNA }}           # Honkai: Nexus Anima codes channel
      DISCORD_WEBHOOK_CODES_ZZZ: ${{ secrets.DISCORD_WEBHOOK_CODES_ZZZ }}           # Zenless Zone Zero codes channel
      DISCORD_WEBHOOK_CODES_WUWA: ${{ secrets.DISCORD_WEBHOOK_CODES_WUWA }}         # Wuthering Waves codes channel
      DISCORD_WEBHOOK_CODES_ANANTA: ${{ secrets.DISCORD_WEBHOOK_CODES_ANANTA }}     # ANANTA codes channel
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}                       # optional catch-all
      DISCORD_WEBHOOK_TEST: ${{ secrets.DISCORD_WEBHOOK_TEST }}                     # test bench: private channel
      NITTER_RSS_TOKEN: ${{ secrets.NITTER_RSS_TOKEN }}                             # optional (same as News-Express)
      # ── Everything else, as JSON (catch-all): per-game SCHEDULE webhooks
      #    (DISCORD_WEBHOOK_SCHEDULE_<GAME>), pings (PING_*), emojis (EMOJI_*) and every other
      #    variable in the README work without editing this file.
      GE_SECRETS_JSON: ${{ toJSON(secrets) }}
      GE_VARS_JSON: ${{ toJSON(vars) }}
      # ── the dispatch inputs, as env (shell steps read these) ──
      KIND: ${{ inputs.only }}                                   # one input feeds both modes
      TEST: ${{ inputs.test }}
      PROBE: ${{ inputs.probe }}
      NO_PING: ${{ !inputs.ping && '1' || '' }}
      PING_FLAG: ${{ inputs.ping && '--ping' || '' }}
      GAME_ARG: ${{ inputs.game != 'all' && inputs.game || '' }}
    steps:
      - name: Check out (branch HEAD, so a queued run sees the previous run's state)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check -q
          pip install -r requirements.txt --disable-pip-version-check -q

      - name: Show resolved config (routing, pings, emojis)
        run: python -m gamexpress validate || true

      # ══ LIVE RUN ══════════════════════════════════════════════════════════════════════
      - name: LIVE · probe one real schedule post (debug — nothing is posted or saved)
        if: inputs.mode == 'live' && inputs.probe != ''
        env:
          ENABLED_FEATURES: schedule
        run: python -m gamexpress probe "$PROBE"

      - name: LIVE · monitor run
        id: run
        if: inputs.mode == 'live' && inputs.probe == ''
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ONLY: ${{ inputs.only != 'all' && inputs.only || '' }}
          GAME: ${{ inputs.game }}
          REPOST: ${{ inputs.repost }}
        run: python -m gamexpress run

      - name: LIVE · commit state (also after a partial failure, so nothing is ever posted twice)
        if: always() && inputs.mode == 'live' && inputs.probe == '' && !inputs.dry_run && steps.run.conclusion != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "state unchanged — nothing to commit"; exit 0; fi
          git commit -m "auto: update state [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "::error::could not push state/state.json after 5 attempts"
          exit 1

      # ══ TEST BENCH (never posts to the real channels, never commits) ══════════════════
      - name: TEST · T1 offline tests (no network, no secrets)
        if: inputs.mode == 'test' && (env.TEST == 'offline-tests' || env.TEST == 'full')
        run: |
          pip install -r requirements-bot.txt pyyaml --disable-pip-version-check -q   # bot + workflow checks too
          python -m compileall -q gamexpress tests
          python tests/test_smoke.py

      - name: TEST · T2 webhook check (one small card per webhook)
        if: inputs.mode == 'test' && (env.TEST == 'webhooks' || env.TEST == 'full')
        run: python -m gamexpress check-webhooks --kind "$KIND" ${GAME_ARG:+--game "$GAME_ARG"}

      - name: TEST · T3 sample cards (labelled 🧪 TEST) to the real routes
        if: inputs.mode == 'test' && (env.TEST == 'sample-cards' || env.TEST == 'full')
        run: python -m gamexpress test-card --kind "$KIND" ${GAME_ARG:+--game "$GAME_ARG"} $PING_FLAG

      - name: TEST · T4 live dry run (real sources, cards built + validated, nothing posted or saved)
        if: inputs.mode == 'test' && (env.TEST == 'live-dry-run' || env.TEST == 'full')
        env:
          DRY_RUN: '1'
          TEST_MODE: '1'
          BOOTSTRAP_POST: '1'
          LOOKBACK_HOURS: '720'
          STATE_PATH: ${{ runner.temp }}/ge-test-state.json
          ONLY: ${{ inputs.only != 'all' && inputs.only || '' }}
          GAME: ${{ inputs.game }}
          ENABLED_FEATURES: schedule,codes   # also on the dev repo (where the variable says none)
          INSTANCE_ROLE: primary
          PEER_STATE_URL: none               # test runs never import the peer's state
        run: python -m gamexpress run

      - name: TEST · T5 live cards to the TEST channel (secret DISCORD_WEBHOOK_TEST)
        if: inputs.mode == 'test' && env.TEST == 'live-test-channel'
        env:
          FORCE_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEST }}
          TEST_MODE: '1'
          BOOTSTRAP_POST: '1'
          LOOKBACK_HOURS: '720'
          STATE_PATH: ${{ runner.temp }}/ge-test-state.json
          ONLY: ${{ inputs.only != 'all' && inputs.only || '' }}
          GAME: ${{ inputs.game }}
          ENABLED_FEATURES: schedule,codes
          INSTANCE_ROLE: primary
          PEER_STATE_URL: none
        run: |
          if [ -z "$FORCE_WEBHOOK" ]; then
            echo "::warning::Add the secret DISCORD_WEBHOOK_TEST (a webhook of a private test channel) to use live-test-channel."
            exit 0
          fi
          python -m gamexpress run
