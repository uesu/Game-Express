name: Source research probe (manual, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Offline self-tests
        run: python tools/source_research_probe.py --self-test
      - name: Official Endfield and NTE sources
        if: always()
        run: python tools/source_research_probe.py --group endfield-nte --annotations
      - name: Official Silver Palace sources
        if: always()
        run: python tools/source_research_probe.py --group silver --annotations
      - name: Fixed official image URLs
        if: always()
        run: python tools/source_research_probe.py --group media --annotations
      - name: Code aggregator checks
        if: always()
        run: python tools/source_research_probe.py --group codes --annotations
      - name: Crimson Witch checks
        if: always()
        run: python tools/source_research_probe.py --group crimson --annotations
