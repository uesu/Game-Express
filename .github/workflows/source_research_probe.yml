name: Source research probe (manual, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install reader dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Offline probe checks
        run: |
          python tools/source_research_probe.py --self-test
          python tools/live_candidate_probe.py --self-test
      - name: Official Endfield and NTE sources
        if: always()
        run: python tools/source_research_probe.py --group endfield-nte --annotations
      - name: Official Silver Palace sources
        if: always()
        run: python tools/source_research_probe.py --group silver --annotations
      - name: Fixed official image URLs
        if: always()
        run: python tools/source_research_probe.py --group media --annotations
      - name: Code aggregator checks
        if: always()
        run: python tools/source_research_probe.py --group codes --annotations
      - name: NTE candidate listing pages
        if: always()
        run: python tools/live_candidate_probe.py --group nte --annotations
      - name: Silver Palace candidate complete listing
        if: always()
        run: python tools/live_candidate_probe.py --group silver --annotations
      - name: Endfield candidate and media preflight
        if: always()
        run: python tools/live_candidate_probe.py --group endfield --annotations
      - name: Old Reddit no-token listings
        if: always()
        run: python tools/live_candidate_probe.py --group reddit0 --annotations
      - name: Redlib mint listings
        if: always()
        run: python tools/live_candidate_probe.py --group reddit1 --annotations
      - name: Redlib naa listings
        if: always()
        run: python tools/live_candidate_probe.py --group reddit2 --annotations
      - name: Limited old Reddit fallback fleet
        if: always()
        run: python tools/live_candidate_probe.py --group redditfleet --annotations
