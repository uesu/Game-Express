name: CI — compile + offline tests

# Safety gate for every PR (and Dependabot bumps): proves the monitor installs,
# compiles and reproduces the reference cards BEFORE anything reaches main.
# No network, no secrets.
#
# Jobs:
#   test                      the real gate (always required)
#   advisory-checks           pip-audit (known CVEs in requirements.txt) + actionlint (workflow
#                              YAML) + zizmor (workflow security) + ruff (Python lint) —
#                              informational only, can NEVER fail this workflow (see the job)
#   automerge                 OPT-IN Dependabot auto-merge: only Dependabot PRs, only after
#                              `test` passed, only when the repository VARIABLE
#                              AUTO_MERGE_DEPENDABOT=yes exists. See docs/DEPENDABOT.md.
#
# Python update PRs are validated by python_version_bump.yml and CI, but always
# wait for attended review/merge. Package-only Dependabot PRs remain opt-in automatic.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
  # Manual, read-only source probe (see the `source-probe` job). Nothing runs it automatically:
  # it exists so a candidate endpoint for a new game or code tracker can be *proven* from a
  # runner when a development sandbox cannot reach the vendor host. No secrets, no writes.
  workflow_dispatch:
    inputs:
      urls:
        description: 'One URL per line (empty = the built-in candidate list)'
        required: false
        default: ''
      mode:
        description: 'summary | links | grep | raw'
        required: false
        default: 'summary'
      pattern:
        description: 'EXTENDED regex used by mode=grep (case-insensitive)'
        required: false
        default: 'api|json|__NEXT_DATA__|article|news|code'
      max_bytes:
        description: 'per-URL output cap for raw/grep'
        required: false
        default: '6000'

permissions:
  contents: read

concurrency:
  # A new commit on the same PR/branch makes the previous CI run pointless, so cancel it: the
  # reviewer gets the answer for the newest commit sooner and no runner minute is spent proving
  # something about a commit nobody will merge. Safe here and NOT in monitor.yml — this workflow
  # only reads; it never posts to Discord and never writes state.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; don't leave a token in .git/config

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15.2'

      # astral-sh doesn't publish a floating major tag like v10; keep `# vX.Y.Z` bare so zizmor verifies it.
      - name: Install uv (same packages pip would install, just a much faster resolver)
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: latest-known            # see monitor.yml for why this is not "latest"

      - name: Install dependencies (a broken requirements.txt fails HERE, not in production)
        env:
          UV_SYSTEM_PYTHON: '1'   # install into the interpreter setup-python just configured, not a venv
        run: uv pip install -r requirements.txt pyyaml -q

      - name: Compile every .py file
        run: python -m compileall -q gamexpress tests .github/scripts

      - name: Validate config + sample cards
        run: python -m gamexpress validate

      - name: Offline smoke + golden tests
        run: python tests/test_smoke.py

      # Every test file has its own plain runner and every one of them is a gate. The two below
      # held 23 regressions (the 2026-10-08 schedule-card faults, the ZZZ 3.3 "Agent" placeholder)
      # that only pytest ever ran -- and CI does not run pytest, so they guarded nothing until
      # 2026-10-15. test_ci_and_the_python_bump_gate_run_every_offline_test_file keeps this list
      # complete.
      - name: Schedule regressions (2026-10-08) + gacha-wiki placeholder guard + Reddit intake reader
        run: |
          python tests/test_schedule_epithet_and_settled.py
          python tests/test_gachabase_kit.py
          python tests/test_beta_sources.py
          python tests/test_feature5_gate_media.py
          python tests/test_gachabase_kit.py
          python tests/test_gachawiki_placeholder.py
          python tests/test_reddit_intake.py
          python tests/test_reddit_usecases.py
          python tests/test_maintenance_live.py
          python tests/test_nte_news.py
          python tests/test_probe_evidence_is_scrubbed.py

      - name: Card preview renders (previews/index.html)
        run: python -m gamexpress preview --out /tmp/previews > /dev/null

  advisory-checks:
    name: Advisory checks (never block a merge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # read-only job

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15.2'

      - name: Known-vulnerability scan of requirements.txt (pypa/pip-audit)
        continue-on-error: true   # informational: a new advisory must never block a hot-fix
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: requirements.txt

      - name: Static check of the workflow YAML itself (rhysd/actionlint via reviewdog)
        continue-on-error: true   # informational only, see above
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4  # v1.84.1
        with:
          reporter: local
          fail_level: none

      - name: Security review of the workflow YAML (zizmorcore/zizmor)
        continue-on-error: true   # informational only, see above
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          inputs: .github/workflows
          advanced-security: false   # print the findings in the log; no code-scanning upload
          persona: regular

      - name: Lint the Python itself (astral-sh/ruff, reading the repo's own ruff.toml)
        continue-on-error: true   # a brand-new ruff release must never block a hot-fix
        # full tag on purpose: ruff-action stopped publishing a floating `v4` tag (only v4.1.0,
        # v4.0.0 exist), so `@v4` does not resolve. Dependabot bumps this line like any other.
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          args: check --output-format=github   # ruff.toml (target-version, line-length, rules) is picked up automatically

  automerge:
    name: Dependabot auto-merge (opt-in)
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      vars.AUTO_MERGE_DEPENDABOT == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Requested permissions remain subject to GitHub's Dependabot/token restrictions.
      # No checkout: the PR's code never runs with write access.
      contents: write
      pull-requests: write
    steps:
      - name: Merge the tested commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const tested = context.payload.pull_request.head.sha;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.draft) { core.info(`#${number} is not open / is a draft — nothing to do.`); return; }
            if (pr.head.sha !== tested) { core.info('New commits arrived after this test run — the next CI run decides.'); return; }
            const requiresWorkflowReview = files => files.some(file =>
              [file.filename, file.previous_filename].some(path =>
                typeof path === 'string' && path.startsWith('.github/workflows/')));
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100,
            });
            if (requiresWorkflowReview(files)) {
              core.info('Workflow files changed: review and merge this update while available, then check the next live run.');
              return;
            }

            for (const merge_method of ['squash', 'merge', 'rebase']) {
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method, sha: tested });
                core.info(`Merged #${number} (${merge_method}) — CI passed on ${tested.slice(0, 7)}.`);
                return;
              } catch (e) {
                if (e.status === 405 && /not allowed/i.test(e.message)) continue;   // that merge style is off in Settings
                core.warning(`Not merged (${e.status}): ${e.message}`);
                return;
              }
            }
            core.warning('No merge method is enabled in Settings → General → Pull Requests.');

  # ---------------------------------------------------------------------------------------------
  # Manual, read-only source probe — the investigation tool for a NEW source.
  #
  # A candidate endpoint (a news page for a new game, a code tracker, an unofficial mirror) has to
  # be proven before it becomes a code path: does it answer, is it a static page or a JSON API,
  # which shape do the entries have, does it need JavaScript? A development sandbox often reaches
  # only GitHub/PyPI, so this job turns a runner into the probe. `workflow_dispatch` only — no
  # schedule, no push, no pull_request — so it never runs on its own and never gates a merge.
  #
  # It writes nothing: no artifact, no comment, no commit. Every value lands in the run log, which
  # the operator reads with `gh run view --log`. Read-only token, no secrets, no network policy
  # change for any other job.
  source-probe:
    name: Source probe (manual, read-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that may write: `mode=save` stores the fetched bytes under
    # `tests/fixtures/probes/` on the dispatched ref so a parser can be written against the real
    # markup and the evidence survives the run (GitHub does not serve this job's log to every
    # client — reading it back through the API needs a download host that a restricted
    # environment may not reach). Nothing else is written, and every other job stays read-only.
    permissions:
      contents: write
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fetch the candidates and print the evidence
        env:
          URLS: ${{ inputs.urls }}
          MODE: ${{ inputs.mode }}
          PATTERN: ${{ inputs.pattern }}
          MAX_BYTES: ${{ inputs.max_bytes }}
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          # Everything `mode=save` must never commit, in one place (used by the redaction below and
          # mirrored by tests/test_probe_evidence_is_scrubbed.py, which fails CI if one ever lands).
          SECRET_SHAPES='AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|discord(app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]{20,}'
          # Candidates only — an entry here is a URL worth re-probing, never a configured source.
          DEFAULT_URLS=$(cat <<'LIST'
          https://www.crimsonwitch.com/codes
          https://www.crimsonwitch.com/codes/Genshin_Impact
          https://www.crimsonwitch.com/feeds/genshin/rss.xml
          https://api.ennead.cc/codes/nte
          https://api.ennead.cc/codes/endfield
          https://api.ennead.cc/codes/silverpalace
          https://api.ennead.cc/mihoyo/nte/codes
          https://nte.perfectworld.com/en/article/news/index.html
          https://endfield.gryphline.com/en-us/news
          https://silverpalace.elementagames.com/en-us/news
          LIST
          )
          [ -n "${URLS:-}" ] || URLS="$DEFAULT_URLS"
          cap="${MAX_BYTES:-6000}"
          case "$cap" in ''|*[!0-9]*) cap=6000 ;; esac
          out="tests/fixtures/probes"
          mkdir -p "$out"
          n=0
          while IFS= read -r url; do
            url="$(printf '%s' "$url" | tr -d '\r' | sed 's/[[:space:]]*$//')"
            [ -n "$url" ] || continue
            n=$((n + 1))
            body="$(mktemp)"
            code="$(curl -sS -L -m 25 -A "$UA" -H 'Accept: */*' -o "$body" -w '%{http_code}' "$url" 2>/dev/null || echo 000)"
            ctype="$(file -b --mime-type "$body" 2>/dev/null || echo unknown)"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            echo "================================================================"
            echo "URL   $url"
            echo "HTTP  $code   TYPE  $ctype   BYTES $bytes"
            case "${MODE:-summary}" in
              raw)
                head -c "$cap" "$body"; echo; echo "---- (truncated at $cap bytes)" ;;
              grep)
                echo "---- token counts"
                grep -Eio "$PATTERN" "$body" | sort | uniq -c | sort -rn | head -40 || echo "---- no match"
                echo "---- matching lines (first 40)"
                grep -Ein "$PATTERN" "$body" | head -40 | cut -c1-300 || true ;;
              links)
                grep -Eo 'href="[^"]+"' "$body" | sed 's/^href="//; s/"$//' | sort -u | head -200 || true ;;
              *)
                for hint in __NEXT_DATA__ __NUXT__ 'application/ld+json' 'data-api' 'api\.' '\.json' '<script' 'window\.__' \
                            'article' 'news' 'code'; do
                  hits="$(grep -Eic "$hint" "$body" 2>/dev/null || true)"
                  [ "${hits:-0}" -gt 0 ] && echo "  hint  $hint  x$hits"
                done
                echo "  title: $(grep -Eio '<title>[^<]*</title>' "$body" | head -1)"
                echo "  head: $(head -c 400 "$body" | tr -s '[:space:]' ' ')" ;;
            esac
            if [ "${MODE:-summary}" = "save" ]; then
              slug="$(printf '%s' "$url" | sed 's#^https\?://##; s#[^A-Za-z0-9._-]#_#g')"
              printf '%s' "$url" > "$out/$slug.url.txt"
              # Credential-shaped strings are scrubbed BEFORE the bytes are committed. A vendor
              # page can carry a key that is public by design -- YouTube's HTML embeds Google's
              # INNERTUBE_API_KEY, which GitHub's secret scanning rightly flags as a "Google API
              # Key" and which opened five alerts on 2026-11-27. Redaction is not a claim that the
              # key is secret; it is that this repository is not the place to keep it.
              SCRUBBED=0
              if grep -qE "$SECRET_SHAPES" "$body" 2>/dev/null; then
                SCRUBBED="$(grep -Eoc "$SECRET_SHAPES" "$body" 2>/dev/null || echo 1)"
                sed -E -e 's/AIza[0-9A-Za-z_-]{35}/REDACTED-GOOGLE-API-KEY/g' \
                       -e 's/gh[pousr]_[A-Za-z0-9]{36,}/REDACTED-GITHUB-TOKEN/g' \
                       -e 's/github_pat_[A-Za-z0-9_]{20,}/REDACTED-GITHUB-PAT/g' \
                       -e 's/AKIA[0-9A-Z]{16}/REDACTED-AWS-KEY/g' \
                       -e 's#(discord(app)?\.com/api/webhooks/[0-9]+/)[A-Za-z0-9_-]{20,}#\1REDACTED#g' \
                       "$body" > "$out/$slug.body.txt"
                bytes="$(wc -c < "$out/$slug.body.txt" | tr -d ' ')"
                echo "  REDACTED $SCRUBBED credential-shaped string(s) before saving"
              else
                cp "$body" "$out/$slug.body.txt"
              fi
              echo "  saved $out/$slug.body.txt ($bytes bytes, HTTP $code, scrubbed=$SCRUBBED)"
            fi
            rm -f "$body"
          done <<< "$URLS"
          echo "================================================================"
          echo "probed $n URL(s)"
          if [ "${MODE:-summary}" = "save" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$out"
            if git diff --cached --quiet; then
              echo "probe evidence unchanged"
            else
              git commit -m "probe: source evidence for ${n} URL(s) [skip ci]"
              git push
            fi
          fi
