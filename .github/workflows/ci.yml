name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify (syntax, workflow contract & offline tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install locked runtime & dev dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      - name: Run verification suite via ci.py adapter
        run: |
          python .github/scripts/ci.py verify

  lock-check:
    name: Dependency lockfile consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install locked runtime & dev dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      - name: Verify requirements.txt and requirements-dev.txt match inputs
        run: |
          python .github/scripts/ci.py lock-check

  ruff:
    name: Ruff lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install locked dev dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff lint via ci.py adapter
        run: |
          python .github/scripts/ci.py ruff

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974  # v1.80.0
        with:
          fail_level: error

  zizmor:
    name: Workflow security audit (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4

  pip-audit:
    name: Dependency CVE audit (pip-audit, advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Audit requirements.txt against OSV / PyPI Advisory DB
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: requirements.txt
          vulnerability-service: osv

  maintenance-ci:
    name: maintenance-ci
    if: always()
    needs: [test, lock-check, ruff, actionlint, zizmor, pip-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Evaluate blocking and advisory CI checks
        env:
          RES_VERIFY: ${{ needs.test.result }}
          RES_LOCK_CHECK: ${{ needs.lock-check.result }}
          RES_RUFF: ${{ needs.ruff.result }}
          RES_ACTIONLINT: ${{ needs.actionlint.result }}
          RES_ZIZMOR: ${{ needs.zizmor.result }}
          RES_PIP_AUDIT: ${{ needs.pip-audit.result }}
        run: |
          python .github/scripts/ci.py gate \
            --results-json "{\"verify\":\"${RES_VERIFY}\",\"lock-check\":\"${RES_LOCK_CHECK}\",\"ruff\":\"${RES_RUFF}\",\"actionlint\":\"${RES_ACTIONLINT}\",\"zizmor\":\"${RES_ZIZMOR}\"}" \
            --advisory-json "{\"pip-audit\":\"${RES_PIP_AUDIT}\"}"
