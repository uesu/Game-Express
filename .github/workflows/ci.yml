name: CI — compile + offline tests

# Safety gate for every PR (and Dependabot bumps): proves the monitor installs,
# compiles and reproduces the reference cards BEFORE anything reaches main.
# No network, no secrets.
#
# The last job is the OPT-IN Dependabot auto-merge: it runs only for Dependabot PRs, only
# after the tests above passed, and only when the repository VARIABLE
# AUTO_MERGE_DEPENDABOT=yes exists. (It lives here, not in a separate workflow_run workflow:
# that trigger never fired in production, 2026-09-25.) See docs/DEPENDABOT.md.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (a broken requirements.txt fails HERE, not in production)
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check -q
          pip install -r requirements.txt -r requirements-bot.txt pyyaml --disable-pip-version-check -q

      - name: Compile every .py file
        run: python -m compileall -q gamexpress tests

      - name: Validate config + sample cards
        run: python -m gamexpress validate

      - name: Offline smoke + golden tests
        run: python tests/test_smoke.py

      - name: Card preview renders (previews/index.html)
        run: python -m gamexpress preview --out /tmp/previews > /dev/null

      - name: Bot module imports (discord.py API surface)
        run: python -c "import discord, discord.app_commands, discord.http; from discord.http import Route; print('discord.py', discord.__version__)"

  automerge:
    name: Dependabot auto-merge (opt-in)
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      vars.AUTO_MERGE_DEPENDABOT == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Dependabot PR runs get a read-only token by default; GitHub lets the permissions key raise
      # it for this job only. No checkout: the PR's code never runs with write access.
      contents: write
      pull-requests: write
    steps:
      - name: Merge the tested commit
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const tested = context.payload.pull_request.head.sha;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.draft) { core.info(`#${number} is not open / is a draft — nothing to do.`); return; }
            if (pr.head.sha !== tested) { core.info('New commits arrived after this test run — the next CI run decides.'); return; }
            for (const merge_method of ['squash', 'merge', 'rebase']) {
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method, sha: tested });
                core.info(`Merged #${number} (${merge_method}) — CI passed on ${tested.slice(0, 7)}.`);
                return;
              } catch (e) {
                if (e.status === 405 && /not allowed/i.test(e.message)) continue;   // that merge style is off in Settings
                core.warning(`Not merged (${e.status}): ${e.message}`);
                return;
              }
            }
            core.warning('No merge method is enabled in Settings → General → Pull Requests.');
