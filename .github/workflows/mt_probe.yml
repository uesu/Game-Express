name: MT probe (manual)

# Manual-only probe of an offline zh→en machine-translation model (Mozilla Firefox Translations,
# via the `firefox-translations` package). It never posts, never reads secrets, and does not
# touch the monitor or state. Used to decide whether machine translation is good enough for
# game text before anything is wired into the card pipeline.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "firefox-translations==0.1.4"

      - name: Translate the Ju Fufu / Vivian samples
        run: |
          python - <<'PY'
          import os, time
          from firefox_translations import Translator

          samples = [
              "潜能觉醒：侠肝义胆",
              "[虎啸]状态下，角色的[连携技]/[终结技]造成的最终伤害提升10%/30%；",
              "[普通攻击：「虎威」]造成的失衡提升50%，",
              "[虎啸]状态下的角色攻击命中敌人时，使其失衡易伤倍率提升25%，失衡结束时移除该效果。",
              "薇薇安自身的异常掌控提升30点",
              "普通攻击：落羽生花造成的异常积蓄效率提升50%",
              "云岿山的小老虎，最善降妖除魔，心系惩奸除恶。",
          ]
          t0 = time.time()
          tr = Translator(src_lang="zh", trg_lang="en", device="cpu")
          print(f"model ready in {time.time() - t0:.1f}s")
          lines = []
          for s in samples:
              out = tr.translate(s)
              lines.append(f"{s}\n  => {out}")
              print(lines[-1])
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## zh→en probe (Firefox Translations)\n\n```\n" + "\n".join(lines) + "\n```\n")
          PY
