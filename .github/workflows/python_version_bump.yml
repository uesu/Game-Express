name: Python Version Bump

on:
  schedule:
    # Weekly on Mondays at 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: python-version-bump
  cancel-in-progress: true

jobs:
  bump:
    name: Select, validate & open Python pin PR
    if: github.repository_owner == 'uesu'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up current pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install locked tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      - name: Select policy-bounded Python release & update pin
        id: check
        env:
          PR_BODY_PATH: ${{ runner.temp }}/python-bump-body.md
        run: |
          python .github/scripts/maintenance.py bump

      - name: Set up candidate Python from updated .python-version
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Re-verify locks, syntax, lint & offline suites on candidate Python
        if: steps.check.outputs.changed == 'true'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt
          python .github/scripts/maintenance.py lock-compile
          python .github/scripts/ci.py lock-check
          python .github/scripts/ci.py verify
          python .github/scripts/ci.py ruff

      - name: Create or updatechore/python-bump Pull Request
        if: steps.check.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ secrets.BUMP_PAT || github.token }}
          branch: chore/python-bump
          delete-branch: true
          commit-message: "chore(python): bump pinned Python to ${{ steps.check.outputs.new_version }}"
          title: "chore(python): bump pinned Python to ${{ steps.check.outputs.new_version }}"
          body-path: ${{ steps.check.outputs.body_path }}

      - name: Record bump summary
        if: always()
        env:
          CHANGED: ${{ steps.check.outputs.changed }}
          OLD_VER: ${{ steps.check.outputs.old_version }}
          NEW_VER: ${{ steps.check.outputs.new_version }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          HAS_BUMP_PAT: ${{ secrets.BUMP_PAT != '' && 'true' || 'false' }}
        run: |
          {
            echo "### Python Runtime Maintenance"
            echo ""
            if [ "${CHANGED}" = "true" ]; then
              echo "- Updated \`.python-version\` from \`${OLD_VER}\` to **\`${NEW_VER}\`**."
              echo "- Pull request: #${PR_NUMBER:-n/a} (\`chore/python-bump\`)."
              if [ "${HAS_BUMP_PAT}" = "true" ]; then
                echo "- Opened with \`BUMP_PAT\`: standard \`pull_request\` CI and \`maintenance_merge.yml\` will evaluate the PR."
              else
                echo "- Opened with \`GITHUB_TOKEN\`: close and reopen the PR (or trigger CI manually) so required checks run before merge."
              fi
            else
              echo "- Already on highest policy-approved release (\`${OLD_VER}\`). No PR needed."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
