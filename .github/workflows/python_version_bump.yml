name: Python version bump (auto)

# Dependabot CANNOT do this job: the interpreter version is a `python-version:` string inside
# workflow YAML, not a tracked dependency file (requirements.txt / package-ecosystem), so it is
# invisible to Dependabot by design — see docs/DEPENDABOT.md. This workflow fills that one gap.
#
# Weekly (same cadence as Dependabot), it compares the pinned python-version against
# actions/python-versions' OWN release manifest — the exact list actions/setup-python downloads
# from — and opens a PR only when a newer STABLE series (with a Linux build) already exists
# there. Nothing is guessed: whatever it proposes is already installable on the runner.
#
# It never merges on its own. The merge-only-if-green gate lives in ci.yml (job
# `automerge-python-bump`), reusing the exact same pattern as the opt-in Dependabot auto-merge:
# it only fires for a PR labelled `python-bump`, only once the full test job (131 offline tests +
# compile + validate + preview) is green on that exact commit, and only when the repository
# VARIABLE AUTO_MERGE_PYTHON_BUMP=yes exists. Leave the variable unset to always review these by
# hand — recommended for at least the first bump (Python 3.15, expected ~October 2027), since a
# brand-new Python *feature* release is the riskiest moment for any third-party dependency.
#
# One-time setup this needs: Settings → Actions → General → Workflow permissions → "Allow GitHub
# Actions to create and approve pull requests" (GitHub blocks workflow-opened PRs until that is
# turned on — same kind of one-time setup as the cron-job.org token in docs/SCHEDULER.md).

on:
  schedule:
    - cron: '0 6 * * 1'       # Monday 06:00 UTC — same day Dependabot checks
  workflow_dispatch: {}        # or run it by hand any time

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install ruff (used only to confirm a target-version bump is safe to propose)
        run: python -m pip install --disable-pip-version-check -q ruff

      - name: Compare the pinned version against actions/python-versions
        id: bump
        env:
          PR_BODY_PATH: ${{ runner.temp }}/python_bump_body.md
        run: python .github/scripts/python_version_bump.py

      - name: Open the PR (only when a newer stable series was found)
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(python): bump to Python ${{ steps.bump.outputs.new_version }}"
          title: "Bump Python ${{ steps.bump.outputs.old_version }} → ${{ steps.bump.outputs.new_version }}"
          body-path: ${{ runner.temp }}/python_bump_body.md
          branch: auto/python-${{ steps.bump.outputs.new_version }}
          delete-branch: true
          labels: python-bump
          add-paths: |
            .github/workflows/ci.yml
            .github/workflows/monitor.yml
            ruff.toml
