name: Python Version Bump

on:
  schedule:
    # Weekly on Mondays at 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      target_version:
        description: "Optional manual candidate override (exact X.Y.Z; always marked review-required)"
        required: false
        default: ""
      dry_run:
        description: "Run selection and secret-free candidate validation without opening/updating a PR"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-version-bump
  cancel-in-progress: true

jobs:
  select:
    name: Select policy-bounded Python candidate
    if: github.repository_owner == 'uesu'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      status: ${{ steps.check.outputs.status }}
      update_kind: ${{ steps.check.outputs.update_kind }}
      review_required: ${{ steps.check.outputs.review_required }}
      auto_merge_eligible: ${{ steps.check.outputs.auto_merge_eligible }}
      old_version: ${{ steps.check.outputs.old_version }}
      new_version: ${{ steps.check.outputs.new_version }}
      selected_minor: ${{ steps.check.outputs.selected_minor }}
      deferred_candidate: ${{ steps.check.outputs.deferred_candidate }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up current pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Select candidate Python version
        id: check
        env:
          TARGET_OVERRIDE: ${{ inputs.target_version }}
        run: |
          if [ -n "${TARGET_OVERRIDE}" ]; then
            python .github/scripts/maintenance.py select --override "${TARGET_OVERRIDE}"
          else
            python .github/scripts/maintenance.py select
          fi

  validate:
    name: Validate candidate Python runtime & locks (secret-free)
    if: needs.select.outputs.changed == 'true'
    needs: [select]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    outputs:
      candidate_tree_sha256: ${{ steps.manifest.outputs.candidate_tree_sha256 }}
      candidate_manifest_json: ${{ steps.manifest.outputs.candidate_manifest_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up candidate Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ needs.select.outputs.new_version }}
          check-latest: false

      - name: Assert candidate Python interpreter, install locked wheels & run pre-rewrite registry
        env:
          CANDIDATE_VERSION: ${{ needs.select.outputs.new_version }}
        run: |
          python .github/scripts/maintenance.py assert-interpreter --expected "${CANDIDATE_VERSION}"
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt
          python .github/scripts/ci.py verify
          python .github/scripts/ci.py ruff

      - name: Apply candidate pin, recompile locks & run post-rewrite unified CI registry
        env:
          CANDIDATE_VERSION: ${{ needs.select.outputs.new_version }}
          OLD_VERSION: ${{ needs.select.outputs.old_version }}
          REVIEW_REQUIRED: ${{ needs.select.outputs.review_required }}
          UPDATE_KIND: ${{ needs.select.outputs.update_kind }}
          PR_BODY_PATH: ${{ runner.temp }}/python-bump-body.md
        run: |
          python .github/scripts/maintenance.py apply --version "${CANDIDATE_VERSION}" --old-version "${OLD_VERSION}" --review-required "${REVIEW_REQUIRED}" --update-kind "${UPDATE_KIND}"
          python .github/scripts/maintenance.py lock-compile --require-exact-python
          python .github/scripts/maintenance.py verify-bump-diff
          python .github/scripts/ci.py run-all --require-exact-python

      - name: Run actionlint on candidate tree
        uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974  # v1.80.0
        with:
          fail_level: error

      - name: Run zizmor workflow audit on candidate tree
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4

      - name: Audit candidate requirements.txt against OSV
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: requirements.txt
          vulnerability-service: osv

      - name: Record validated candidate tree manifest
        id: manifest
        run: |
          python .github/scripts/maintenance.py compute-candidate-manifest

  publish:
    name: Publish chore/python-bump Pull Request
    if: needs.select.outputs.changed == 'true' && inputs.dry_run != true
    needs: [select, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.cpr.outputs.pull-request-number }}
      pr_url: ${{ steps.cpr.outputs.pull-request-url }}
    steps:
      - name: Require BUMP_PAT secret for publication
        env:
          HAS_BUMP_PAT: ${{ secrets.BUMP_PAT != '' && 'true' || 'false' }}
        run: |
          if [ "${HAS_BUMP_PAT}" != "true" ]; then
            echo "::error::Missing required secret BUMP_PAT for runtime proposal publication; refusing to fall back to GITHUB_TOKEN because it suppresses normal pull_request CI."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up candidate Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ needs.select.outputs.new_version }}
          check-latest: false

      - name: Install locked compiler tools, apply validated candidate changes & verify manifest parity
        id: apply
        env:
          CANDIDATE_VERSION: ${{ needs.select.outputs.new_version }}
          OLD_VERSION: ${{ needs.select.outputs.old_version }}
          REVIEW_REQUIRED: ${{ needs.select.outputs.review_required }}
          UPDATE_KIND: ${{ needs.select.outputs.update_kind }}
          EXPECTED_MANIFEST_JSON: ${{ needs.validate.outputs.candidate_manifest_json }}
          PR_BODY_PATH: ${{ runner.temp }}/python-bump-body.md
        run: |
          python .github/scripts/maintenance.py assert-interpreter --expected "${CANDIDATE_VERSION}"
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt
          python .github/scripts/maintenance.py apply --version "${CANDIDATE_VERSION}" --old-version "${OLD_VERSION}" --review-required "${REVIEW_REQUIRED}" --update-kind "${UPDATE_KIND}"
          python .github/scripts/maintenance.py lock-compile --require-exact-python
          python .github/scripts/maintenance.py verify-bump-diff
          python .github/scripts/maintenance.py verify-candidate-manifest --expected-json "${EXPECTED_MANIFEST_JSON}"

      - name: Create or update chore/python-bump Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ secrets.BUMP_PAT }}
          branch: chore/python-bump
          delete-branch: true
          commit-message: "chore(python): bump pinned Python from ${{ needs.select.outputs.old_version }} to ${{ needs.select.outputs.new_version }}"
          title: "chore(python): bump pinned Python from ${{ needs.select.outputs.old_version }} to ${{ needs.select.outputs.new_version }}"
          body-path: ${{ steps.apply.outputs.body_path }}
          labels: ${{ needs.select.outputs.review_required == 'true' && 'review-required' || '' }}

  report:
    name: Record runtime proposer summary
    if: always()
    needs: [select, validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write proposer outcome to step summary
        env:
          STATUS: ${{ needs.select.outputs.status }}
          CHANGED: ${{ needs.select.outputs.changed }}
          UPDATE_KIND: ${{ needs.select.outputs.update_kind }}
          REVIEW_REQ: ${{ needs.select.outputs.review_required }}
          OLD_VER: ${{ needs.select.outputs.old_version }}
          NEW_VER: ${{ needs.select.outputs.new_version }}
          DEFERRED_CAND: ${{ needs.select.outputs.deferred_candidate }}
          REASON: ${{ needs.select.outputs.reason }}
          VALIDATE_RES: ${{ needs.validate.result }}
          TREE_SHA: ${{ needs.validate.outputs.candidate_tree_sha256 }}
          PUBLISH_RES: ${{ needs.publish.result }}
          PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
          PR_URL: ${{ needs.publish.outputs.pr_url }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Python Runtime Maintenance"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source SHA | \`${SOURCE_SHA}\` |"
            echo "| Previous \`.python-version\` | \`${OLD_VER:-n/a}\` |"
            echo "| Candidate \`.python-version\` | \`${NEW_VER:-n/a}\` |"
            echo "| Deferred candidate | \`${DEFERRED_CAND:-none}\` |"
            echo "| Proposer status | **\`${STATUS:-failed}\`** |"
            echo "| Update classification | \`${UPDATE_KIND:-none}\` (review_required=\`${REVIEW_REQ:-false}\`) |"
            echo "| Validation job | \`${VALIDATE_RES:-skipped}\` (tree_sha256=\`${TREE_SHA:-n/a}\`) |"
            echo "| Publish job | \`${PUBLISH_RES:-skipped}\` (dry_run=\`${DRY_RUN}\`) |"
            echo "| Pull request | ${PR_URL:-#${PR_NUMBER:-none}} |"
            echo "| Reason | ${REASON:-n/a} |"
          } >> "${GITHUB_STEP_SUMMARY}"
