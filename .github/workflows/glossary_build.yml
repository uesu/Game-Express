name: Glossary build (manual)

# Builds the per-game Chinese -> English glossary from the official EN and CN records
# (nanoka static for every game; Encore v2 as a second WuWa source). It is manual only and
# NEVER commits or posts: each game's reviewed JSON is uploaded as a workflow artifact to
# download, check, and hand over. Nothing reads these files at runtime until a reviewed copy
# is committed (see gamexpress/glossary_build.py).
#
# HNA and Ananta are excluded until they ship.

on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Which game to build'
        type: choice
        options: [all, zzz, starrail, genshin, wuwa]
        default: all
      max_items:
        description: 'Items checked per kind (default 400)'
        required: false
        default: '400'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        game: [zzz, starrail, genshin, wuwa]
    steps:
      - name: Skip games not selected
        id: pick
        env:
          SELECTED: ${{ inputs.game }}
          THIS: ${{ matrix.game }}
        run: |
          if [ "$SELECTED" = "all" ] || [ "$SELECTED" = "$THIS" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.pick.outputs.run == 'true'
        with:
          persist-credentials: false   # nothing here pushes

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          python-version: '3.14.9'

      - name: Install uv
        if: steps.pick.outputs.run == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: latest-known

      - name: Install dependencies
        if: steps.pick.outputs.run == 'true'
        env:
          UV_SYSTEM_PYTHON: '1'
        run: uv pip install -r requirements.txt pyyaml -q

      - name: Build the glossary for ${{ matrix.game }}
        if: steps.pick.outputs.run == 'true'
        env:
          MAX_ITEMS: ${{ inputs.max_items }}
        run: python -m gamexpress build-glossary --game "${{ matrix.game }}" --max-items "$MAX_ITEMS"

      - name: Upload the reviewed-by-hand JSON (download, do not commit here)
        if: steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: glossary-${{ matrix.game }}
          path: gamexpress/data/glossary/${{ matrix.game }}.json
          if-no-files-found: error
          retention-days: 14
