name: Maintenance Auto-Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  check_suite:
    types: [completed]
  status:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to evaluate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maintenance-merge-${{ github.event.pull_request.number || github.event.workflow_run.id || github.event.check_suite.id || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Evaluate & merge eligible maintenance PR
    if: >-
      github.repository_owner == 'uesu' &&
      (vars.AUTO_MERGE_DEPENDABOT == 'yes' || vars.AUTO_MERGE_PYTHON_BUMP == 'yes')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    env:
      AUTO_MERGE_DEPENDABOT: ${{ vars.AUTO_MERGE_DEPENDABOT }}
      AUTO_MERGE_PYTHON_BUMP: ${{ vars.AUTO_MERGE_PYTHON_BUMP }}
      DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Load trusted policy, evaluate gates & merge verified head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const { execFileSync } = require("child_process");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tempRoot = path.join(process.env.RUNNER_TEMP || "/tmp", "trusted-base");
            fs.mkdirSync(path.join(tempRoot, ".github", "scripts"), { recursive: true });

            // 1. Resolve candidate PR number(s) from the triggering event via the API
            const prNumbers = new Set();
            if (context.payload.pull_request && context.payload.pull_request.number) {
              prNumbers.add(Number(context.payload.pull_request.number));
            }
            if (process.env.DISPATCH_PR_NUMBER) {
              const parsed = Number(process.env.DISPATCH_PR_NUMBER);
              if (Number.isInteger(parsed) && parsed > 0) {
                prNumbers.add(parsed);
              }
            }
            const refShaCandidates = [];
            if (context.payload.workflow_run) {
              const wfRun = context.payload.workflow_run;
              for (const pr of wfRun.pull_requests || []) {
                if (pr && pr.number) {
                  prNumbers.add(Number(pr.number));
                }
              }
              if (wfRun.head_sha) {
                refShaCandidates.push(wfRun.head_sha);
              }
            }
            if (context.payload.check_suite) {
              const cs = context.payload.check_suite;
              for (const pr of cs.pull_requests || []) {
                if (pr && pr.number) {
                  prNumbers.add(Number(pr.number));
                }
              }
              if (cs.head_sha) {
                refShaCandidates.push(cs.head_sha);
              }
            }
            if (context.payload.sha) {
              refShaCandidates.push(context.payload.sha);
            }
            if (prNumbers.size === 0 && refShaCandidates.length > 0) {
              const openPrs = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                base: "main",
                per_page: 50,
              });
              for (const p of openPrs.data || []) {
                if (p.head && refShaCandidates.includes(p.head.sha)) {
                  prNumbers.add(Number(p.number));
                }
              }
            }

            if (prNumbers.size === 0) {
              core.summary.addRaw("### Maintenance Auto-Merge\n\n- No associated open pull request found for this event.\n");
              await core.summary.write();
              return;
            }

            // Load trusted maintenance policy & helpers from main
            for (const relPath of [
              ".github/maintenance.json",
              ".github/scripts/maintenance_common.py",
              ".github/scripts/maintenance.py",
            ]) {
              const resp = await github.rest.repos.getContent({
                owner,
                repo,
                path: relPath,
                ref: "heads/main",
              });
              const content = Buffer.from(resp.data.content, resp.data.encoding || "base64").toString("utf8");
              fs.writeFileSync(path.join(tempRoot, relPath), content, "utf8");
            }
            const maintScript = path.join(tempRoot, ".github", "scripts", "maintenance.py");
            const trustedPolicy = JSON.parse(
              fs.readFileSync(path.join(tempRoot, ".github", "maintenance.json"), "utf8")
            );
            const trackedBumpFiles = (
              (trustedPolicy.python && trustedPolicy.python.allowed_bump_files) || [
                ".python-version",
                "ruff.toml",
                "requirements.txt",
                "requirements-dev.txt",
              ]
            ).slice().sort();

            function extractFindingsFromText(...texts) {
              const found = [];
              const advRe = /\b(?:GHSA-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}|PYSEC-\d{4}-\d+|CVE-\d{4}-\d{4,})\b/g;
              const cntRe = /found\s+(\d+)\s+known\s+vulnerabilit/i;
              for (const txt of texts) {
                if (!txt) continue;
                let m;
                while ((m = advRe.exec(txt)) !== null) {
                  if (!found.includes(m[0])) found.push(m[0]);
                }
                const cm = cntRe.exec(txt);
                if (cm && Number(cm[1]) > 0 && found.length === 0) {
                  found.push(`UNIDENTIFIED_VULNERABILITY_COUNT_${cm[1]}`);
                }
              }
              return found;
            }

            function parseProvenanceStepOrSummary(jobs) {
              for (const job of jobs || []) {
                if (!job) continue;
                if (job.conclusion && String(job.conclusion).toLowerCase() !== "success") {
                  continue;
                }
                const outSummary = (job.output && job.output.summary) || "";
                const outText = (job.output && job.output.text) || "";
                for (const blob of [outSummary, outText]) {
                  const cm = /<!--\s*GAMEXPRESS_PROPOSER_PROVENANCE:\s*(\{[\s\S]*?\})\s*-->/.exec(blob);
                  if (cm) {
                    try {
                      return JSON.parse(cm[1]);
                    } catch (_e) {
                      // continue
                    }
                  }
                }
                for (const step of job.steps || []) {
                  if (!step) continue;
                  if (step.status && String(step.status).toLowerCase() !== "completed") continue;
                  if (step.conclusion && String(step.conclusion).toLowerCase() !== "success") continue;
                  const sname = step.name || "";
                  if (!sname.startsWith("PROVENANCE ")) continue;
                  const kv = {};
                  const tokRe = /([a-z_]+)=([^\s]+)/gi;
                  let m;
                  while ((m = tokRe.exec(sname)) !== null) {
                    kv[m[1].toLowerCase()] = m[2];
                  }
                  return {
                    published_pr_number:
                      kv.pr && kv.pr !== "none" && /^\d+$/.test(kv.pr) ? Number(kv.pr) : null,
                    published_head_sha: kv.head && kv.head !== "none" ? kv.head : "",
                    source_sha: kv.source && kv.source !== "none" ? kv.source : "",
                    old_version: kv.old && kv.old !== "none" ? kv.old : "",
                    new_version: kv.new && kv.new !== "none" ? kv.new : "",
                    update_kind: kv.kind && kv.kind !== "none" ? kv.kind : "",
                    review_required: kv.review ? kv.review.toLowerCase() === "true" : true,
                    auto_merge_eligible: kv.eligible ? kv.eligible.toLowerCase() === "true" : false,
                    candidate_tree_sha256: kv.tree && kv.tree !== "none" ? kv.tree : "",
                    dry_run: kv.dry_run ? kv.dry_run.toLowerCase() === "true" : false,
                  };
                }
              }
              return null;
            }

            function parseCandidateVersionFromFiles(filesList) {
              for (const item of filesList || []) {
                if (!item || typeof item !== "object") continue;
                const fname = String(item.filename || item.path || "");
                if (fname !== ".python-version") continue;
                const found = [];
                for (const line of String(item.patch || "").split(/\r?\n/)) {
                  if (!line.startsWith("+") || line.startsWith("+++")) continue;
                  const body = line.slice(1).trim();
                  if (/^\d+\.\d+\.\d+$/.test(body)) {
                    found.push(body);
                  }
                }
                return found.length === 1 ? found[0] : null;
              }
              return null;
            }

            function parseNoticeRecord(message, kind) {
              if (typeof message !== "string") return null;
              let text = message.trim();
              if (text.startsWith("::notice::")) {
                text = text.slice("::notice::".length);
              }
              const prefix = `${kind} `;
              if (!text.startsWith(prefix)) return null;
              try {
                const parsed = JSON.parse(text.slice(prefix.length).trim());
                return parsed && typeof parsed === "object" && !Array.isArray(parsed)
                  ? parsed
                  : null;
              } catch (_e) {
                return null;
              }
            }

            async function computeActualCandidateManifest(refSha) {
              const fileDigests = {};
              const combined = crypto.createHash("sha256");
              let pyVer = "";
              for (const rel of trackedBumpFiles) {
                try {
                  const fResp = await github.rest.repos.getContent({
                    owner,
                    repo,
                    path: rel,
                    ref: refSha,
                  });
                  const fData = fResp && fResp.data !== undefined ? fResp.data : fResp;
                  if (
                    !fData ||
                    typeof fData !== "object" ||
                    String(fData.encoding || "") !== "base64" ||
                    typeof fData.content !== "string" ||
                    !fData.content
                  ) {
                    return {
                      complete: false,
                      error: `contents-malformed:${rel}`,
                      python_version: "",
                      files: {},
                      tree_sha256: "",
                    };
                  }
                  const rawBuf = Buffer.from(fData.content, "base64");
                  const digest = crypto.createHash("sha256").update(rawBuf).digest("hex");
                  fileDigests[rel] = digest;
                  combined.update(`${rel}:${digest}\n`, "utf8");
                  if (rel === ".python-version") {
                    pyVer = rawBuf.toString("utf8").trim();
                  }
                } catch (err) {
                  const st = (err && err.status) || 404;
                  return {
                    complete: false,
                    error: `contents-api:${rel}:${st}`,
                    python_version: "",
                    files: {},
                    tree_sha256: "",
                  };
                }
              }
              return {
                complete: true,
                python_version: pyVer,
                files: fileDigests,
                tree_sha256: combined.digest("hex"),
              };
            }

            async function collectPrSnapshot(prNumber, initialHeadSha) {
              const detailResp = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const pr = detailResp && detailResp.data !== undefined ? detailResp.data : detailResp;
              const headSha = pr.head && pr.head.sha ? pr.head.sha : "";
              const headRef = pr.head && pr.head.ref ? pr.head.ref : "";
              const baseRef = pr.base && pr.base.ref ? pr.base.ref : "";
              const baseSha = pr.base && pr.base.sha ? pr.base.sha : "";
              const baseRepo = pr.base && pr.base.repo ? pr.base.repo.full_name : "";
              const headRepo = pr.head && pr.head.repo ? pr.head.repo.full_name : "";
              const headRepoFork = Boolean(pr.head && pr.head.repo && pr.head.repo.fork);
              const prAuthor = pr.user && pr.user.login ? pr.user.login : "";
              const prAuthorType = pr.user && pr.user.type ? pr.user.type : "";

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });

              let publishedCommit = null;
              let publishedCommitError = "";
              if (headSha && typeof github.rest.repos.getCommit === "function") {
                try {
                  const commitResp = await github.rest.repos.getCommit({
                    owner,
                    repo,
                    ref: headSha,
                  });
                  const cData =
                    commitResp && commitResp.data !== undefined ? commitResp.data : commitResp;
                  if (cData && typeof cData === "object" && !Array.isArray(cData)) {
                    publishedCommit = cData;
                  } else {
                    publishedCommitError = "commit-api:malformed";
                  }
                } catch (cErr) {
                  const st = (cErr && cErr.status) || 404;
                  publishedCommitError = `commit-api:${st}`;
                }
              } else if (headSha && Array.isArray(commits)) {
                const foundCommit = commits.find((c) => c && c.sha === headSha) || null;
                if (
                  foundCommit &&
                  foundCommit.commit &&
                  typeof foundCommit.commit === "object" &&
                  (foundCommit.commit.author || foundCommit.commit.committer)
                ) {
                  publishedCommit = foundCommit;
                } else {
                  publishedCommitError = "commit-api:404";
                }
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });
              const checksFirst = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              });
              const allCheckRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              });
              const wfRunsForSha = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  head_sha: headSha,
                  per_page: 100,
                }
              );

              const wfRunsById = new Map();
              const jobsById = new Map();
              for (const wfRun of wfRunsForSha || []) {
                if (!wfRun || !wfRun.id) continue;
                wfRunsById.set(Number(wfRun.id), wfRun);
                if (wfRun.path === ".github/workflows/ci.yml" || wfRun.name === "CI") {
                  const wfJobs = await github.paginate(
                    github.rest.actions.listJobsForWorkflowRun,
                    {
                      owner,
                      repo,
                      run_id: wfRun.id,
                      per_page: 100,
                    }
                  );
                  for (const job of wfJobs || []) {
                    if (job && job.id) {
                      jobsById.set(Number(job.id), { job, wfRun });
                    }
                  }
                }
              }

              // Collect complete producer evidence for every mandatory check name
              const expectedCheckNames = Array.isArray(trustedPolicy.mandatory_check_names)
                ? trustedPolicy.mandatory_check_names
                : [];
              const checkRunUrlRe =
                /^https:\/\/github\.com\/([^/\s]+)\/([^/\s]+)\/actions\/runs\/(\d+)\/job\/(\d+)\/?$/;
              const producerEvidence = {};
              for (const run of allCheckRuns || []) {
                if (!run || typeof run !== "object") continue;
                const checkName = String(run.name || "");
                if (!expectedCheckNames.includes(checkName) || producerEvidence[checkName]) {
                  continue;
                }
                const rawDetailsUrl = String(run.details_url || run.html_url || "").trim();
                const idMatch = checkRunUrlRe.exec(rawDetailsUrl);
                if (!idMatch || `${idMatch[1]}/${idMatch[2]}` !== `${owner}/${repo}`) {
                  producerEvidence[checkName] = { error: "unresolvable-details-url" };
                  continue;
                }
                const runId = Number(idMatch[3]);
                const jobId = Number(idMatch[4]);
                let jobObj = jobsById.has(jobId) ? jobsById.get(jobId).job : null;
                let wfRunObj =
                  wfRunsById.get(runId) ||
                  (jobsById.has(jobId) ? jobsById.get(jobId).wfRun : null);
                if (!jobObj && typeof github.rest.actions.getJobForWorkflowRun === "function") {
                  try {
                    const jResp = await github.rest.actions.getJobForWorkflowRun({
                      owner,
                      repo,
                      job_id: jobId,
                    });
                    jobObj = jResp && jResp.data !== undefined ? jResp.data : jResp;
                  } catch (jErr) {
                    const st = (jErr && jErr.status) || 404;
                    producerEvidence[checkName] = { error: `job-api:${st}` };
                    continue;
                  }
                }
                if (!jobObj || typeof jobObj !== "object") {
                  producerEvidence[checkName] = { error: "job-api:404" };
                  continue;
                }
                if (!wfRunObj && typeof github.rest.actions.getWorkflowRun === "function") {
                  try {
                    const rResp = await github.rest.actions.getWorkflowRun({
                      owner,
                      repo,
                      run_id: runId,
                    });
                    wfRunObj = rResp && rResp.data !== undefined ? rResp.data : rResp;
                  } catch (rErr) {
                    const st = (rErr && rErr.status) || 404;
                    producerEvidence[checkName] = { error: `run-api:${st}` };
                    continue;
                  }
                }
                if (!wfRunObj || typeof wfRunObj !== "object") {
                  producerEvidence[checkName] = { error: "run-api:404" };
                  continue;
                }
                const posInt = (v) => {
                  const n = Number(v);
                  return Number.isInteger(n) && n > 0 ? n : null;
                };
                producerEvidence[checkName] = {
                  workflow: String(wfRunObj.path || ""),
                  job: String(jobObj.name || ""),
                  check_run_id: posInt(run.id),
                  run_id: runId,
                  run_record_id: posInt(wfRunObj.id),
                  job_id: jobId,
                  job_record_id: posInt(jobObj.id),
                  job_run_id: posInt(jobObj.run_id),
                  job_check_run_url: String(jobObj.check_run_url || ""),
                  run_attempt: posInt(wfRunObj.run_attempt),
                  job_run_attempt: posInt(jobObj.run_attempt),
                  head_sha: String(wfRunObj.head_sha || ""),
                  job_head_sha: String(jobObj.head_sha || ""),
                  job_status: String(jobObj.status || ""),
                  job_conclusion: String(jobObj.conclusion || ""),
                  run_status: String(wfRunObj.status || ""),
                  run_conclusion: String(wfRunObj.conclusion || ""),
                };
              }

              const combinedStatusResp = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: headSha,
              });

              const fileDiffs = {};
              let patchMissing = false;
              for (const f of files) {
                if (typeof f.patch === "string" && f.patch.trim().length > 0) {
                  fileDiffs[f.filename] = f.patch;
                } else {
                  patchMissing = true;
                }
              }

              const mappedCommits = (commits || []).map((c) => ({
                sha: c.sha,
                author:
                  (c.author && c.author.login) ||
                  (c.commit && c.commit.author && c.commit.author.name) ||
                  "",
                message: (c.commit && c.commit.message) || "",
              }));

              // Resolve publisher & proposal provenance against trusted base policy
              let provenance = {
                verified: false,
                lane: "",
                publisher: prAuthor,
                publisher_type: prAuthorType,
                source: "unknown",
                head_ref: headRef,
                head_sha: "",
              };
              let actualCandidateManifest = null;
              let actualCandidateTreeSha256 = "";
              let publicationEvidence = null;

              const pubPolicyBlock =
                (trustedPolicy && trustedPolicy.publication_evidence) || {};
              const expCommitIdentity = String(
                pubPolicyBlock.commit_identity || "github-actions[bot]"
              ).trim();
              const expCommitName = String(
                pubPolicyBlock.commit_name || expCommitIdentity || "github-actions[bot]"
              ).trim();
              const expCommitEmail = String(
                pubPolicyBlock.commit_email ||
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ).trim();
              const pinnedPip = String(
                (trustedPolicy.compiler && trustedPolicy.compiler.pip) || "26.1.1"
              ).trim();
              const pinnedPipTools = String(
                (trustedPolicy.compiler && trustedPolicy.compiler.pip_tools) || "7.5.3"
              ).trim();

              if (
                headRef.startsWith("dependabot/pip/") ||
                headRef.startsWith("dependabot/github_actions/") ||
                headRef.startsWith("dependabot/github-actions/")
              ) {
                const isDepBot =
                  (prAuthor === "dependabot[bot]" || prAuthor === "app/dependabot") &&
                  !headRepoFork &&
                  baseRepo !== "" &&
                  baseRepo === headRepo &&
                  mappedCommits.length > 0 &&
                  mappedCommits.every(
                    (c) => c.author === "dependabot[bot]" || c.author === "app/dependabot"
                  );
                provenance = {
                  verified: isDepBot,
                  lane: headRef.startsWith("dependabot/pip/")
                    ? "dependabot_pip"
                    : "dependabot_actions",
                  publisher: prAuthor,
                  publisher_type: prAuthorType,
                  source: isDepBot ? "github-dependabot" : "untrusted",
                  head_ref: headRef,
                  head_sha: isDepBot ? headSha : "",
                };
              } else if (
                headRef === "chore/python-bump" ||
                headRef === "chore/python-version-bump"
              ) {
                actualCandidateManifest = await computeActualCandidateManifest(headSha);
                actualCandidateTreeSha256 = actualCandidateManifest.complete
                  ? actualCandidateManifest.tree_sha256
                  : "";
                const candidateVersionFromDiff = parseCandidateVersionFromFiles(files);

                const inspectedRecords = [];
                let proposerRunsError = "";
                try {
                  const bumpRunsResp = await github.rest.actions.listWorkflowRuns({
                    owner,
                    repo,
                    workflow_id: "python_version_bump.yml",
                    branch: "main",
                    status: "completed",
                    per_page: 20,
                  });
                  const bumpRunsData =
                    bumpRunsResp && bumpRunsResp.data !== undefined
                      ? bumpRunsResp.data
                      : bumpRunsResp;
                  const bumpRuns = Array.isArray(bumpRunsData)
                    ? bumpRunsData
                    : (bumpRunsData && bumpRunsData.workflow_runs) || [];
                  for (const r of bumpRuns) {
                    if (!r || !r.id) continue;
                    const expectedAttempt = Number(r.run_attempt || 1);
                    let attemptObj = null;
                    if (
                      typeof github.rest.actions.getWorkflowRunAttempt === "function"
                    ) {
                      try {
                        const attResp = await github.rest.actions.getWorkflowRunAttempt({
                          owner,
                          repo,
                          run_id: r.id,
                          attempt_number: expectedAttempt,
                        });
                        attemptObj =
                          attResp && attResp.data !== undefined ? attResp.data : attResp;
                      } catch (_aErr) {
                        attemptObj = null;
                      }
                    } else {
                      attemptObj = {
                        id: r.id,
                        run_attempt: expectedAttempt,
                        status: r.status || "completed",
                        conclusion: r.conclusion || "",
                        head_sha: r.head_sha || "",
                      };
                    }

                    let rJobs = [];
                    try {
                      if (
                        typeof github.rest.actions.listJobsForWorkflowRunAttempt === "function"
                      ) {
                        rJobs = await github.paginate(
                          github.rest.actions.listJobsForWorkflowRunAttempt,
                          {
                            owner,
                            repo,
                            run_id: r.id,
                            attempt_number: expectedAttempt,
                            per_page: 100,
                          }
                        );
                      } else {
                        rJobs = await github.paginate(
                          github.rest.actions.listJobsForWorkflowRun,
                          {
                            owner,
                            repo,
                            run_id: r.id,
                            per_page: 100,
                          }
                        );
                      }
                    } catch (_jErr) {
                      rJobs = [];
                    }
                    rJobs = (rJobs || []).filter(
                      (j) =>
                        j &&
                        (j.run_attempt === undefined ||
                          j.run_attempt === null ||
                          Number(j.run_attempt) === expectedAttempt)
                    );
                    const selectJob =
                      rJobs.find((j) => j && /select/i.test(j.name || "")) || null;
                    const validateJob =
                      rJobs.find((j) => j && /validate/i.test(j.name || "")) || null;
                    const publishJob =
                      rJobs.find((j) => j && /publish/i.test(j.name || "")) || null;

                    let noticeValidation = null;
                    let noticePublication = null;
                    if (typeof github.rest.checks.listAnnotations === "function") {
                      for (const jobItem of rJobs) {
                        let jobCheckRunId = null;
                        if (jobItem && typeof jobItem.check_run_url === "string") {
                          const cm = /\/check-runs\/(\d+)\/?$/.exec(jobItem.check_run_url.trim());
                          if (cm) jobCheckRunId = Number(cm[1]);
                        }
                        if (!jobCheckRunId && jobItem && jobItem.id) {
                          jobCheckRunId = Number(jobItem.id);
                        }
                        if (!jobCheckRunId) continue;
                        try {
                          const annResp = await github.rest.checks.listAnnotations({
                            owner,
                            repo,
                            check_run_id: jobCheckRunId,
                            per_page: 100,
                          });
                          const anns =
                            annResp && annResp.data !== undefined ? annResp.data : annResp;
                          for (const ann of Array.isArray(anns) ? anns : []) {
                            const msg = ann && typeof ann === "object" ? ann.message : "";
                            const pv = parseNoticeRecord(msg, "proposal-validation");
                            if (
                              pv &&
                              pv.run_id === r.id &&
                              pv.run_attempt === expectedAttempt
                            ) {
                              noticeValidation = pv;
                            }
                            const pp = parseNoticeRecord(msg, "proposal-publication");
                            if (
                              pp &&
                              pp.run_id === r.id &&
                              pp.run_attempt === expectedAttempt &&
                              pp.pull_number === Number(pr.number)
                            ) {
                              noticePublication = pp;
                            }
                          }
                        } catch (_annErr) {
                          // continue
                        }
                      }
                    }

                    const pubMeta = parseProvenanceStepOrSummary(rJobs) || {};

                    const selectConc = selectJob
                      ? String(selectJob.conclusion || "").toLowerCase()
                      : pubMeta.select_conclusion || "missing";
                    const validateConc = validateJob
                      ? String(validateJob.conclusion || "").toLowerCase()
                      : pubMeta.validate_conclusion || "missing";
                    const publishConc = publishJob
                      ? String(publishJob.conclusion || "").toLowerCase()
                      : pubMeta.publish_conclusion || "missing";
                    const isDryRun = Boolean(
                      pubMeta.dry_run === true ||
                        String(pubMeta.dry_run || "").toLowerCase() === "true" ||
                        (selectConc === "success" &&
                          validateConc === "success" &&
                          publishConc === "skipped")
                    );
                    const pubPrNum =
                      noticePublication && noticePublication.pull_number !== undefined
                        ? Number(noticePublication.pull_number)
                        : pubMeta.published_pr_number !== undefined &&
                            pubMeta.published_pr_number !== null
                          ? Number(pubMeta.published_pr_number)
                          : pubMeta.pr_number !== undefined && pubMeta.pr_number !== null
                            ? Number(pubMeta.pr_number)
                            : null;
                    const pubHeadSha = String(
                      (noticePublication && noticePublication.published_head) ||
                        pubMeta.published_head_sha ||
                        ""
                    ).trim();
                    const pubSourceSha = String(
                      (noticeValidation && noticeValidation.source_head) ||
                        pubMeta.source_sha ||
                        r.head_sha ||
                        ""
                    ).trim();
                    const pubTreeSha = String(
                      pubMeta.candidate_tree_sha256 || ""
                    ).trim();
                    const newVerStr = String(
                      (noticeValidation && noticeValidation.candidate_version) ||
                        pubMeta.new_version ||
                        ""
                    ).trim();

                    let validationRecord = noticeValidation;
                    if (
                      !validationRecord &&
                      validateConc === "success" &&
                      (pubTreeSha || (pubMeta.candidate_manifest && pubMeta.candidate_manifest.files))
                    ) {
                      let recDigests = {};
                      if (
                        pubMeta.candidate_manifest &&
                        pubMeta.candidate_manifest.files &&
                        typeof pubMeta.candidate_manifest.files === "object"
                      ) {
                        recDigests = { ...pubMeta.candidate_manifest.files };
                      } else if (
                        actualCandidateManifest &&
                        actualCandidateManifest.complete &&
                        actualCandidateManifest.tree_sha256 === pubTreeSha
                      ) {
                        recDigests = { ...actualCandidateManifest.files };
                      } else {
                        for (const rel of trackedBumpFiles) {
                          recDigests[rel] = `tree-mismatch:${pubTreeSha}`;
                        }
                      }
                      validationRecord = {
                        run_id: r.id,
                        run_attempt: expectedAttempt,
                        source_head: pubSourceSha,
                        candidate_version: newVerStr,
                        interpreter: String(pubMeta.interpreter || newVerStr),
                        pip: String(pubMeta.pip || pinnedPip),
                        pip_tools: String(pubMeta.pip_tools || pinnedPipTools),
                        digests: recDigests,
                      };
                    }

                    let publicationRecord = noticePublication;
                    if (!publicationRecord && publishConc === "success" && !isDryRun) {
                      const runActorLogin =
                        (r.actor && r.actor.login) || "github-actions[bot]";
                      publicationRecord = {
                        run_id: r.id,
                        run_attempt: expectedAttempt,
                        pull_number: pubPrNum,
                        published_head: pubHeadSha,
                        branch: String(pubMeta.branch || "chore/python-bump"),
                        pr_author: String(pubMeta.pr_author || prAuthor),
                        run_actor: String(pubMeta.run_actor || runActorLogin),
                        commit_identity: String(
                          pubMeta.commit_identity || expCommitIdentity
                        ),
                        digests:
                          (pubMeta.published_digests &&
                            typeof pubMeta.published_digests === "object" && {
                              ...pubMeta.published_digests,
                            }) ||
                          (validationRecord && validationRecord.digests
                            ? { ...validationRecord.digests }
                            : {}),
                      };
                    }

                    inspectedRecords.push({
                      raw_run: r,
                      raw_attempt: attemptObj,
                      validation_record: validationRecord,
                      publication_record: publicationRecord,
                      workflow: r.path || "",
                      workflow_name: r.name || "",
                      workflow_run_id: r.id,
                      workflow_run_attempt: r.run_attempt || 1,
                      workflow_event: r.event || "",
                      workflow_conclusion: String(r.conclusion || "").toLowerCase(),
                      head_branch: r.head_branch || "main",
                      source_sha: pubSourceSha,
                      select_conclusion: selectConc,
                      validate_conclusion: validateConc,
                      publish_conclusion: publishConc,
                      dry_run: isDryRun,
                      published_pr_number: pubPrNum,
                      published_head_sha: pubHeadSha,
                      old_version: String(pubMeta.old_version || "").trim(),
                      new_version: newVerStr,
                      update_kind: String(pubMeta.update_kind || "").trim(),
                      review_required:
                        typeof pubMeta.review_required === "boolean"
                          ? pubMeta.review_required
                          : String(pubMeta.review_required || "true").toLowerCase() === "true",
                      auto_merge_eligible:
                        typeof pubMeta.auto_merge_eligible === "boolean"
                          ? pubMeta.auto_merge_eligible
                          : String(pubMeta.auto_merge_eligible || "false").toLowerCase() ===
                            "true",
                      candidate_tree_sha256: pubTreeSha,
                      candidate_manifest: pubMeta.candidate_manifest || null,
                    });
                  }
                } catch (err) {
                  const st = (err && err.status) || 500;
                  proposerRunsError = `proposer-runs-api:${st}`;
                }

                // Prefer exact (pr_number + published_head_sha) match, then pr_number match, then latest run
                let matchedRec =
                  inspectedRecords.find(
                    (rec) =>
                      rec.published_pr_number === Number(pr.number) &&
                      rec.published_head_sha !== "" &&
                      rec.published_head_sha === headSha
                  ) ||
                  inspectedRecords.find(
                    (rec) => rec.published_pr_number === Number(pr.number)
                  ) ||
                  inspectedRecords[0] ||
                  null;

                publicationEvidence = {
                  repository: `${owner}/${repo}`,
                  candidate_version: candidateVersionFromDiff,
                  expected_commit_identity: expCommitIdentity,
                  expected_commit_name: expCommitName,
                  expected_commit_email: expCommitEmail,
                  proposal_digests:
                    actualCandidateManifest && actualCandidateManifest.complete
                      ? actualCandidateManifest.files
                      : {},
                  published_commit: publishedCommit,
                  proposer_run: matchedRec ? matchedRec.raw_run : null,
                  proposer_attempt: matchedRec ? matchedRec.raw_attempt : null,
                  validation_record: matchedRec ? matchedRec.validation_record : null,
                  publication_record: matchedRec ? matchedRec.publication_record : null,
                };
                if (!actualCandidateManifest || !actualCandidateManifest.complete) {
                  publicationEvidence.error =
                    (actualCandidateManifest && actualCandidateManifest.error) ||
                    "contents-api:incomplete";
                } else if (!publishedCommit) {
                  publicationEvidence.error = publishedCommitError || "commit-api:404";
                } else if (proposerRunsError) {
                  publicationEvidence.error = proposerRunsError;
                }

                // Non-authoritative consistency check on PR body (editable text can NEVER grant permission,
                // but tampering or an explicit Review required: true in the body blocks auto-merge).
                const bodyText = pr.body || "";
                const revMatch = /\|\s*Review required\s*\|\s*`(true|false)`/i.exec(bodyText);
                const eligMatch = /\|\s*Auto-merge eligible\s*\|\s*`(true|false)`/i.exec(
                  bodyText
                );
                const kindMatch = /\|\s*Update classification\s*\|\s*`([^`]+)`/i.exec(bodyText);
                const bodyReviewRequired = revMatch
                  ? revMatch[1].toLowerCase() === "true"
                  : null;
                const bodyAutoMergeEligible = eligMatch
                  ? eligMatch[1].toLowerCase() === "true"
                  : null;
                const bodyUpdateKind = kindMatch ? kindMatch[1].trim() : "";

                let bodyTampered = false;
                if (matchedRec) {
                  if (
                    bodyReviewRequired !== null &&
                    bodyReviewRequired !== matchedRec.review_required
                  ) {
                    bodyTampered = true;
                  }
                  if (
                    bodyAutoMergeEligible !== null &&
                    bodyAutoMergeEligible !== matchedRec.auto_merge_eligible
                  ) {
                    bodyTampered = true;
                  }
                  if (bodyUpdateKind && bodyUpdateKind !== matchedRec.update_kind) {
                    bodyTampered = true;
                  }
                }

                const manifestVerified = Boolean(
                  matchedRec &&
                    matchedRec.candidate_tree_sha256 &&
                    /^[0-9a-f]{64}$/.test(matchedRec.candidate_tree_sha256) &&
                    actualCandidateManifest &&
                    actualCandidateManifest.complete &&
                    actualCandidateManifest.tree_sha256 === matchedRec.candidate_tree_sha256
                );

                const verifiedBump = Boolean(
                  matchedRec &&
                    matchedRec.workflow === ".github/workflows/python_version_bump.yml" &&
                    matchedRec.head_branch === "main" &&
                    matchedRec.workflow_conclusion === "success" &&
                    matchedRec.select_conclusion === "success" &&
                    matchedRec.validate_conclusion === "success" &&
                    matchedRec.publish_conclusion === "success" &&
                    !matchedRec.dry_run &&
                    matchedRec.published_pr_number === Number(pr.number) &&
                    matchedRec.published_head_sha !== "" &&
                    matchedRec.published_head_sha === headSha &&
                    matchedRec.source_sha !== "" &&
                    (!baseSha || matchedRec.source_sha === baseSha) &&
                    matchedRec.update_kind === "patch" &&
                    matchedRec.review_required === false &&
                    matchedRec.auto_merge_eligible === true &&
                    manifestVerified &&
                    !bodyTampered &&
                    !headRepoFork &&
                    baseRepo !== "" &&
                    baseRepo === headRepo
                );

                provenance = {
                  verified: verifiedBump,
                  lane: "python_bump",
                  publisher: prAuthor,
                  publisher_type: prAuthorType,
                  source: "python-version-bump-workflow",
                  workflow: matchedRec ? matchedRec.workflow : "",
                  workflow_name: matchedRec ? matchedRec.workflow_name : "",
                  workflow_run_id: matchedRec ? matchedRec.workflow_run_id : null,
                  workflow_run_attempt: matchedRec ? matchedRec.workflow_run_attempt : null,
                  workflow_event: matchedRec ? matchedRec.workflow_event : "",
                  workflow_conclusion: matchedRec ? matchedRec.workflow_conclusion : "",
                  select_conclusion: matchedRec ? matchedRec.select_conclusion : "missing",
                  validate_conclusion: matchedRec ? matchedRec.validate_conclusion : "missing",
                  publish_conclusion: matchedRec ? matchedRec.publish_conclusion : "missing",
                  dry_run: matchedRec ? matchedRec.dry_run : false,
                  published_pr_number: matchedRec ? matchedRec.published_pr_number : null,
                  published_head_sha: matchedRec ? matchedRec.published_head_sha : "",
                  source_sha: matchedRec ? matchedRec.source_sha : "",
                  old_version: matchedRec ? matchedRec.old_version : "",
                  new_version: matchedRec ? matchedRec.new_version : "",
                  update_kind: matchedRec ? matchedRec.update_kind : "",
                  review_required: matchedRec ? matchedRec.review_required : true,
                  auto_merge_eligible: matchedRec ? matchedRec.auto_merge_eligible : false,
                  candidate_tree_sha256: matchedRec ? matchedRec.candidate_tree_sha256 : "",
                  candidate_manifest: matchedRec ? matchedRec.candidate_manifest : null,
                  actual_candidate_tree_sha256: actualCandidateTreeSha256,
                  manifest_verified: manifestVerified,
                  body_tampered: bodyTampered,
                  head_ref: headRef,
                  // Never copy pr.head.sha into provenance.head_sha; use only the proposer run's published SHA
                  head_sha: matchedRec ? matchedRec.published_head_sha : "",
                };
              }

              // Map check runs with producing workflow/run metadata and inner job steps
              const mappedCheckRuns = [];
              for (const run of allCheckRuns || []) {
                const jobEntry = jobsById.get(Number(run.id)) || null;
                let wfRun = jobEntry ? jobEntry.wfRun : null;
                if (!wfRun && run.details_url) {
                  const dm = /\/actions\/runs\/(\d+)/.exec(run.details_url);
                  if (dm) {
                    wfRun = wfRunsById.get(Number(dm[1])) || null;
                  }
                }
                const annotations = [];
                if (
                  (run.name === "Dependency CVE audit (pip-audit, advisory)" ||
                    run.name === "pip-audit") &&
                  run.output &&
                  Number(run.output.annotations_count || 0) > 0
                ) {
                  try {
                    const annResp = await github.rest.checks.listAnnotations({
                      owner,
                      repo,
                      check_run_id: run.id,
                      per_page: 50,
                    });
                    for (const a of annResp.data || []) {
                      annotations.push({
                        title: a.title || "",
                        message: a.message || "",
                        annotation_level: a.annotation_level || "",
                      });
                    }
                  } catch (_err) {
                    // Fail closed if security annotations cannot be read
                    annotations.push({
                      title: "ANNOTATION_FETCH_ERROR",
                      message: "Found 1 known vulnerability (annotations unreadable)",
                    });
                  }
                }
                mappedCheckRuns.push({
                  id: run.id,
                  name: run.name || "",
                  head_sha: run.head_sha || "",
                  status: run.status || "",
                  conclusion: run.conclusion || "",
                  app_slug: run.app && run.app.slug ? run.app.slug : "",
                  workflow_id: wfRun ? wfRun.workflow_id : null,
                  workflow_name: wfRun ? wfRun.name || "" : "",
                  workflow_path: wfRun ? wfRun.path || "" : "",
                  run_id: wfRun ? wfRun.id : null,
                  run_attempt: wfRun ? wfRun.run_attempt || 1 : null,
                  steps:
                    jobEntry && Array.isArray(jobEntry.job.steps)
                      ? jobEntry.job.steps.map((s) => ({
                          name: s.name || "",
                          status: s.status || "",
                          conclusion: s.conclusion || "",
                        }))
                      : [],
                  output_title: run.output && run.output.title ? run.output.title : "",
                  output_summary: run.output && run.output.summary ? run.output.summary : "",
                  output_text: run.output && run.output.text ? run.output.text : "",
                  annotations,
                });
              }

              // Build real security_scan evidence from the pip-audit check run & inner step
              const pipAuditCandidates = mappedCheckRuns.filter(
                (r) =>
                  (r.name === "Dependency CVE audit (pip-audit, advisory)" ||
                    r.name === "pip-audit") &&
                  r.workflow_path === ".github/workflows/ci.yml"
              );
              const pipAuditRun =
                pipAuditCandidates.length > 0
                  ? pipAuditCandidates[pipAuditCandidates.length - 1]
                  : null;
              const auditStep =
                pipAuditRun && Array.isArray(pipAuditRun.steps)
                  ? pipAuditRun.steps.find((s) =>
                      /audit|pip-audit|osv|vulnerability/i.test(s.name || "")
                    ) || null
                  : null;
              const annTexts =
                pipAuditRun && Array.isArray(pipAuditRun.annotations)
                  ? pipAuditRun.annotations.map((a) => `${a.title || ""} ${a.message || ""}`)
                  : [];
              const scanFindings = pipAuditRun
                ? extractFindingsFromText(
                    pipAuditRun.output_title,
                    pipAuditRun.output_summary,
                    pipAuditRun.output_text,
                    ...annTexts
                  )
                : [];
              let scanStatus = "unavailable";
              if (pipAuditRun && auditStep) {
                if (
                  String(pipAuditRun.status).toLowerCase() !== "completed" ||
                  String(auditStep.status).toLowerCase() !== "completed"
                ) {
                  scanStatus = "pending";
                } else if (scanFindings.length > 0) {
                  scanStatus = "vulnerable";
                } else if (
                  String(auditStep.conclusion).toLowerCase() !== "success" ||
                  String(pipAuditRun.conclusion).toLowerCase() !== "success"
                ) {
                  scanStatus = "failed";
                } else {
                  scanStatus = "clean";
                }
              }

              const securityScan = {
                present: Boolean(pipAuditRun && auditStep),
                check_name: pipAuditRun ? pipAuditRun.name : "",
                head_sha: pipAuditRun ? pipAuditRun.head_sha : "",
                workflow_path: pipAuditRun ? pipAuditRun.workflow_path : "",
                run_id: pipAuditRun ? pipAuditRun.run_id : null,
                wrapper_conclusion: pipAuditRun ? pipAuditRun.conclusion : "",
                step_name: auditStep ? auditStep.name : "",
                step_conclusion: auditStep ? auditStep.conclusion : "",
                status: scanStatus,
                findings: scanFindings,
              };

              // Never manufacture passing checks or convert null mergeability to MERGEABLE
              const mergeableVal =
                pr.mergeable === true
                  ? "MERGEABLE"
                  : pr.mergeable === false
                    ? "CONFLICTING"
                    : "UNKNOWN";

              return {
                pr_number: pr.number,
                title: pr.title || "",
                base_repo: baseRepo,
                head_repo: headRepo,
                head_repo_fork: headRepoFork,
                base_ref: baseRef,
                base_sha: baseSha,
                head_ref: headRef,
                head_sha: initialHeadSha || headSha,
                refreshed_head_sha: headSha,
                author: prAuthor,
                actor: context.actor || "",
                state: pr.state ? pr.state.toUpperCase() : "CLOSED",
                is_draft: Boolean(pr.draft),
                mergeable: mergeableVal,
                mergeable_state: pr.mergeable_state || "unknown",
                labels: (pr.labels || []).map((l) => (typeof l === "string" ? l : l.name || "")),
                reviews: (reviews || []).map((r) => ({
                  id: r.id,
                  author: r.user ? r.user.login : "",
                  state: r.state || "",
                  submitted_at: r.submitted_at || "",
                })),
                commits: mappedCommits,
                published_commit: publishedCommit,
                publication_evidence: publicationEvidence,
                producer_evidence: producerEvidence,
                provenance,
                actual_candidate_tree_sha256: actualCandidateTreeSha256,
                actual_candidate_manifest:
                  actualCandidateManifest && actualCandidateManifest.complete
                    ? actualCandidateManifest
                    : null,
                changed_files: (files || []).map((f) => f.filename),
                files_total_count: Number(pr.changed_files || files.length),
                file_diffs: fileDiffs,
                require_diff_metadata: true,
                pagination_incomplete: Boolean(patchMissing),
                check_runs: mappedCheckRuns,
                checks_total_count: Number(
                  (checksFirst.data && checksFirst.data.total_count) || allCheckRuns.length
                ),
                security_scan: securityScan,
                combined_status:
                  combinedStatusResp.data && combinedStatusResp.data.total_count > 0
                    ? combinedStatusResp.data.state
                    : "success",
                commit_statuses: (combinedStatusResp.data && combinedStatusResp.data.statuses) || [],
                vars: {
                  AUTO_MERGE_DEPENDABOT: process.env.AUTO_MERGE_DEPENDABOT || "",
                  AUTO_MERGE_PYTHON_BUMP: process.env.AUTO_MERGE_PYTHON_BUMP || "",
                },
              };
            }

            function runEvaluate(snapshot, idxLabel) {
              const jsonPath = path.join(tempRoot, `pr-${snapshot.pr_number}-${idxLabel}.json`);
              fs.writeFileSync(jsonPath, JSON.stringify(snapshot, null, 2), "utf8");
              const stdout = execFileSync(
                "python3",
                [maintScript, "evaluate-automerge", "--pr-json", `@${jsonPath}`],
                { cwd: tempRoot, encoding: "utf8" }
              );
              const lines = stdout.trim().split("\n");
              const jsonEnd = lines.findIndex((l) => l.startsWith("eligible="));
              const jsonText = (jsonEnd >= 0 ? lines.slice(0, jsonEnd) : lines).join("\n");
              return JSON.parse(jsonText);
            }

            const summaryLines = ["### Maintenance Auto-Merge Controller", ""];

            for (const prNumber of prNumbers) {
              const snap1 = await collectPrSnapshot(prNumber, "");
              const dec1 = runEvaluate(snap1, "phase1");

              if (!dec1.eligible) {
                summaryLines.push(
                  `- **PR #${prNumber}** (\`${snap1.head_ref}\` @ \`${snap1.head_sha.slice(0, 7)}\`): **${dec1.classification}** — ${dec1.reason}`
                );
                continue;
              }

              // Phase 2: Immediate pre-merge refresh of head, state, mergeability, labels, reviews & checks
              const snap2 = await collectPrSnapshot(prNumber, snap1.head_sha);
              const dec2 = runEvaluate(snap2, "phase2-refresh");
              if (!dec2.eligible) {
                summaryLines.push(
                  `- **PR #${prNumber}** (\`${snap2.head_ref}\` @ \`${snap2.refreshed_head_sha.slice(0, 7)}\`): blocked on pre-merge refresh — ${dec2.reason}`
                );
                continue;
              }

              const methods = ["squash", "merge", "rebase"];
              let mergeResult = null;
              let lastErr = null;
              for (const method of methods) {
                try {
                  const resp = await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: prNumber,
                    sha: snap2.head_sha,
                    merge_method: method,
                  });
                  mergeResult = resp.data;
                  break;
                } catch (err) {
                  lastErr = err;
                  // Only try fallback merge method on HTTP 405 (method not allowed by repo settings)
                  if (!err || err.status !== 405) {
                    break;
                  }
                }
              }

              if (!mergeResult) {
                const msg = lastErr && lastErr.message ? lastErr.message : "merge API call failed";
                core.setFailed(`PR #${prNumber}: merge failed (${msg})`);
                summaryLines.push(`- **PR #${prNumber}**: ❌ merge failed (${msg})`);
                continue;
              }

              const respPath = path.join(tempRoot, `merge-resp-${prNumber}.json`);
              fs.writeFileSync(respPath, JSON.stringify(mergeResult, null, 2), "utf8");
              execFileSync(
                "python3",
                [
                  maintScript,
                  "verify-merge-result",
                  "--response-json",
                  `@${respPath}`,
                  "--expected-head-sha",
                  snap2.head_sha,
                ],
                { cwd: tempRoot, encoding: "utf8" }
              );

              summaryLines.push(
                `- **PR #${prNumber}** (\`${snap2.head_ref}\` @ \`${snap2.head_sha.slice(0, 7)}\`): ✅ merged (\`${mergeResult.sha.slice(0, 7)}\`)`
              );
            }

            core.summary.addRaw(summaryLines.join("\n") + "\n");
            await core.summary.write();
