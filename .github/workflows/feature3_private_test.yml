name: Private Feature 3 card test (manual only)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare only or send fixed cards to the dedicated private webhook
        type: choice
        options: [prepare, post]
        default: prepare
        required: true

permissions:
  contents: read

jobs:
  private-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Offline guards
        run: python tools/feature3_webhook_test.py --self-test
      - name: Prepare fixed official cards without posting
        if: ${{ inputs.action == 'prepare' }}
        run: python tools/feature3_webhook_test.py --prepare-only
      - name: Send fixed cards to the private test webhook
        if: ${{ inputs.action == 'post' }}
        env:
          FEATURE3_TEST_WEBHOOK: ${{ secrets.FEATURE3_TEST_WEBHOOK }}
        run: python tools/feature3_webhook_test.py
