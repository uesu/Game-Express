# zizmor (https://docs.zizmor.sh) configuration for .github/workflows/.
rules:
  bot-conditions:
    ignore:
      # github.actor checks in maintenance_merge.yml are paired with same-repository,
      # base-branch (main), branch-prefix, and file-allowlist verification in
      # .github/scripts/maintenance.py loaded from the trusted base commit.
      - maintenance_merge.yml

  dangerous-triggers:
    ignore:
      # maintenance_merge.yml uses pull_request_target without checking out or executing
      # untrusted PR code; policy and script are loaded from pr.base.sha via the API.
      - maintenance_merge.yml

  unpinned-uses:
    ignore:
      - "*.yml"
