# Automated dependency updates for Python packages (requirements.in / requirements.txt /
# requirements-dev.in / requirements-dev.txt) and GitHub Actions (SHA pins in .github/workflows/).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3  # zizmor: ignore[dependabot-cooldown]
      semver-major-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3  # zizmor: ignore[dependabot-cooldown]
      semver-major-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
    commit-message:
      prefix: "chore(ci)"
